<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل یکپارچه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f6fa; --card:#fff; --ink:#0b2540; --muted:#5b6b7c; --line:#dbe4ec;
    --brand:#0f5fa6; --brand-dark:#0a4276; --err:#b91c1c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer}

  #loginView{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  #loginForm{background:var(--card);padding:28px;border-radius:12px;width:min(340px,100%);
    display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 12px rgba(15,95,166,.1)}
  #loginForm h1{margin:0 0 4px;font-size:1.15rem;color:var(--brand-dark);text-align:center}
  #loginForm input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.95rem}
  #loginForm input:focus{outline:2px solid var(--brand);outline-offset:1px}
  .btn-primary{background:var(--brand);color:#fff;border:0;padding:11px;border-radius:8px;font-size:.95rem;font-weight:600}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
  #loginErr{color:var(--err);font-size:.85rem;min-height:1.2em;text-align:center}

  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:10px 16px}
  /* در RTL اولین فرزند سمت راست است، پس همبرگر سمت راست قرار می‌گیرد */
  #menuBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
  #menuBtn:hover{background:#eef4fa}
  #menuBtn span{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--brand-dark);transition:transform .2s,opacity .2s}
  #menuBtn[aria-expanded="true"] span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  #menuBtn[aria-expanded="true"] span:nth-child(2){opacity:0}
  #menuBtn[aria-expanded="true"] span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  header h1{margin:0;font-size:1.05rem;color:var(--brand-dark);flex:1}
  #userPill{font-size:.8rem;color:var(--muted);background:#eef4fa;border-radius:999px;padding:4px 12px;white-space:nowrap}
  #logoutBtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:.85rem;color:var(--err)}
  #logoutBtn:hover{background:#fef2f2}

  main{max-width:1280px;margin:0 auto;padding:16px}
  #hint{color:var(--muted);text-align:center;margin:60px 0;font-size:.95rem}
  #netWarn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}

  #stack{display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;text-align:right;font-size:1rem;color:var(--ink)}
  .panel-head:hover{background:#f7fafd}
  .panel-num{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex:none}
  .panel-title{font-weight:700;flex:1}
  .panel-desc{font-size:.8rem;color:var(--muted);font-weight:400;display:block;margin-top:2px}
  .chev{transition:transform .2s;color:var(--muted);flex:none}
  .panel.open .chev{transform:rotate(180deg)}
  .panel-body{display:none;border-top:1px solid var(--line)}
  .panel.open .panel-body{display:block}
  .panel-tools{display:flex;padding:6px 12px;background:#f7fafd;font-size:.8rem}
  .panel-tools a{color:var(--brand);text-decoration:none}
  .panel-tools a:hover{text-decoration:underline}
  .panel iframe{display:block;width:100%;height:max(520px,calc(100vh - 210px));border:0;background:#fff}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="loginView" class="hidden">
  <form id="loginForm">
    <h1>ورود به پنل</h1>
    <input id="username" placeholder="نام کاربری" autocomplete="username" required>
    <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
    <button id="loginBtn" class="btn-primary" type="submit">ورود</button>
    <div id="loginErr" role="alert"></div>
  </form>
</div>

<div id="appView" class="hidden">
  <header>
    <button id="menuBtn" type="button" aria-label="منو" aria-expanded="false" aria-controls="stack">
      <span></span><span></span><span></span>
    </button>
    <h1>پنل یکپارچه</h1>
    <span id="userPill"></span>
    <button id="logoutBtn" type="button">خروج</button>
  </header>
  <main>
    <div id="netWarn" class="hidden">ارتباط با سرور برقرار نشد؛ دوباره تلاش می‌شود.</div>
    <p id="hint">برای نمایش پنل‌ها روی منوی سه‌خط (بالا سمت راست) بزنید.</p>
    <section id="stack" class="hidden" aria-label="پنل‌ها"></section>
  </main>
</div>

<script>
const API = ((window.APP_CONFIG && window.APP_CONFIG.API_BASE) || '').replace(/\/+$/, '');
const AUTH = API + '/endorsement/api';             // لاگین مشترک = لاگین پنل الحاقیه
const TOKEN_KEY = 'endorsement-panel-token';       // پنل‌های داخل iframe (هم‌مبدأ) همین کلید را می‌خوانند
const PANELS = [
  { title: 'پنل الحاقیه',               desc: 'حذف تخفیفات و اصلاح مشخصات مالک/بیمه‌گذار', url: 'panels/endorsement/index.html' },
  { title: 'استعلام بیمه‌نامه (سنهاب)', desc: 'استعلام بیمه‌نامه ثالث و جزئیات آن',         url: 'panels/estelam/index.html' },
  { title: 'تاریخچه پلاک',              desc: 'محاسبه‌ی تخفیف قابل انتقال پلاک',            url: 'panels/tarikhche/index.html' },
];

const $ = id => document.getElementById(id);
const loginView = $('loginView'), appView = $('appView'), stack = $('stack'), menuBtn = $('menuBtn');

const getToken   = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } };
const setToken   = t  => { try { localStorage.setItem(TOKEN_KEY, t); } catch(e){} };
const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch(e){} };

function showLogin(msg){
  appView.classList.add('hidden');
  loginView.classList.remove('hidden');
  buildPanels();                       // iframeها را پاک می‌کند تا بعد از خروج چیزی باز نماند
  closeMenu();
  $('password').value = '';
  $('loginErr').textContent = msg || '';
}
function showApp(me){
  loginView.classList.add('hidden');
  appView.classList.remove('hidden');
  $('userPill').textContent = (me.username || '') + (me.role === 'admin' ? ' · مدیر' : ' · کاربر');
}

// برمی‌گرداند: شیء کاربر | null (توکن نامعتبر) | undefined (خطای شبکه)
async function checkSession(){
  const token = getToken();
  if (!token) return null;
  try {
    const r = await fetch(AUTH + '/me', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (r.ok) return await r.json();
    if (r.status === 401) { clearToken(); return null; }
    return undefined;
  } catch(e) { return undefined; }
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('loginErr'), btn = $('loginBtn');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی...';
  try {
    const r = await fetch(AUTH + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
    });
    if (r.status === 429) { err.textContent = 'تلاش‌های ناموفق زیاد بود؛ چند لحظه بعد دوباره امتحان کنید.'; return; }
    if (!r.ok) { err.textContent = 'نام کاربری یا رمز عبور اشتباه است.'; return; }
    const d = await r.json();
    setToken(d.token);
    showApp({ username: d.username, role: d.role });
  } catch(ex) {
    err.textContent = 'ارتباط با سرور برقرار نشد.';
  } finally {
    btn.disabled = false; btn.textContent = 'ورود';
  }
});

$('logoutBtn').addEventListener('click', async () => {
  try { await fetch(AUTH + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + getToken() } }); } catch(e){}
  clearToken();
  showLogin();
});

function openMenu(){ stack.classList.remove('hidden'); $('hint').classList.add('hidden'); menuBtn.setAttribute('aria-expanded','true'); }
function closeMenu(){ stack.classList.add('hidden'); $('hint').classList.remove('hidden'); menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.addEventListener('click', () => stack.classList.contains('hidden') ? openMenu() : closeMenu());

function buildPanels(){
  stack.replaceChildren();
  PANELS.forEach((p, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'panel';
    wrap.innerHTML = `
      <button class="panel-head" type="button" aria-expanded="false">
        <span class="panel-num">${i + 1}</span>
        <span class="panel-title">${p.title}<span class="panel-desc">${p.desc}</span></span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="panel-body">
        <div class="panel-tools"><a href="${p.url}" target="_blank" rel="noopener">باز کردن در تب جدید ↗</a></div>
      </div>`;
    const head = wrap.querySelector('.panel-head'), body = wrap.querySelector('.panel-body');
    head.addEventListener('click', () => {
      const open = wrap.classList.toggle('open');
      head.setAttribute('aria-expanded', open);
      if (open && !body.querySelector('iframe')) {          // lazy: فقط بار اول
        const f = document.createElement('iframe');
        f.src = p.url; f.title = p.title;
        body.appendChild(f);
      }
    });
    stack.appendChild(wrap);
  });
}

(async function init(){
  buildPanels();
  const me = await checkSession();
  if (me) showApp(me);
  else showLogin(me === undefined ? 'ارتباط با سرور برقرار نشد.' : '');
  // نشست ۱۲ ساعته؛ هر دقیقه چک می‌کنیم. خطای موقت شبکه کاربر را بیرون نمی‌اندازد.
  setInterval(async () => {
    if (appView.classList.contains('hidden')) return;
    const m = await checkSession();
    $('netWarn').classList.toggle('hidden', m !== undefined);
    if (m === null) showLogin('نشست شما تمام شد؛ دوباره وارد شوید.');
  }, 60000);
})();
</script>
</body>
</html>
