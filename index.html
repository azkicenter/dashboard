<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>داشبورد عملیات</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script>
  // تم (روشن/تاریک): همان کلیدی که پنل تاریخچه‌خان هم می‌خواند، تا هر چهار صفحه یک تم داشته باشند
  (function () {
    try {
      var t = localStorage.getItem('tarikhcheTheme') === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: rgba(255,255,255,.72);
    --surface-strong: rgba(255,255,255,.9);
    --surface-tint: rgba(217,236,255,.55);
    --ink: #0F1B33;
    --ink-soft: rgba(15,27,51,.68);
    --ink-faint: rgba(15,27,51,.46);
    --line: rgba(23,169,255,.32);
    --accent: #17A9FF;
    --accent-deep: #1656F5;
    --accent-soft: rgba(23,169,255,.20);
    --accent-strong: #0D6FCB;
    --danger: #E0453F;  --danger-soft: rgba(224,69,63,.16);
    --amber: #B96A0C;   --amber-soft: rgba(224,138,23,.16);
    --scrim: rgba(15,27,51,.38);
    --radius-lg: 20px; --radius: 14px; --radius-sm: 9px;
    --glass-blur: 18px;
    --shadow-card: 0 8px 28px rgba(15,72,150,.14), inset 0 1px 0 rgba(255,255,255,.6);
    --shadow-float: 0 24px 55px -14px rgba(15,72,150,.22), inset 0 1px 0 rgba(255,255,255,.7);
    --font: 'Vazirmatn', Tahoma, Arial, sans-serif;
    --bar-h: 64px;
  }
  html[data-theme="dark"] {
    --surface: rgba(255,255,255,.07);
    --surface-strong: rgba(14,20,38,.92);
    --surface-tint: rgba(255,255,255,.04);
    --ink: #EAF0FB;
    --ink-soft: rgba(234,240,251,.68);
    --ink-faint: rgba(234,240,251,.44);
    --line: rgba(255,255,255,.14);
    --accent-deep: #4C8DFF;
    --accent-soft: rgba(23,169,255,.22);
    --accent-strong: #3AA0FF;
    --danger: #FF6B64;  --danger-soft: rgba(255,107,100,.18);
    --amber: #F2A93B;   --amber-soft: rgba(242,169,59,.18);
    --scrim: rgba(0,0,0,.55);
    --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    --shadow-float: 0 24px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: #0c1226; color: var(--ink); font-size: 14px; overflow: hidden; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }

  /* پس‌زمینه‌ی گرادیانی ثابت (همان تم تاریخچه‌خوانی) */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(23,169,255,.55), transparent 62%),
      radial-gradient(680px 540px at 106% 6%, rgba(124,92,224,.4), transparent 62%),
      radial-gradient(700px 560px at 88% 102%, rgba(255,105,170,.32), transparent 62%),
      radial-gradient(640px 520px at 4% 104%, rgba(31,169,113,.3), transparent 62%),
      linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
    animation: glow-shift 24s ease-in-out infinite;
  }
  html[data-theme="dark"] .bg-glow {
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(23,169,255,.32), transparent 60%),
      radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.28), transparent 60%),
      radial-gradient(700px 560px at 88% 102%, rgba(156,135,240,.26), transparent 60%),
      radial-gradient(640px 520px at 4% 104%, rgba(52,201,140,.2), transparent 60%),
      linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
  }
  @keyframes glow-shift { 0%, 100% { filter: saturate(1) hue-rotate(0deg); } 50% { filter: saturate(1.18) hue-rotate(10deg); } }
  @media (prefers-reduced-motion: reduce) { .bg-glow { animation: none; } * { transition-duration: .01ms !important; } }

  .glass {
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- ورود ---------- */
  #loginView { position: relative; z-index: 1; height: 100%; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  #loginForm { width: min(380px, 100%); border-radius: var(--radius-lg); padding: 30px 26px 26px;
    display: flex; flex-direction: column; gap: 14px; position: relative; box-shadow: var(--shadow-float); }
  #loginForm .login-logo { display: block; width: min(240px, 80%); height: auto; margin: 0 auto 6px; pointer-events: none; user-select: none; }
  #loginForm h1 { margin: 0; font-size: 1.25rem; font-weight: 800; text-align: center; color: var(--ink); }
  #loginForm .sub { margin: -6px 0 6px; text-align: center; font-size: .8rem; color: var(--ink-soft); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: .8rem; font-weight: 500; color: var(--ink-soft); }
  .field input {
    padding: 11px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font: inherit; font-size: .92rem; color: var(--ink); width: 100%; direction: ltr; text-align: center;
    background: var(--surface-tint);
    -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
    outline: none; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .field input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
  .field input:-webkit-autofill { -webkit-text-fill-color: var(--ink) !important; -webkit-box-shadow: 0 0 0 1000px rgba(217,236,255,.9) inset !important; transition: background-color 9999s ease-in-out 0s !important; }
  html[data-theme="dark"] .field input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #141b2e inset !important; }

  .btn-primary {
    color: #fff; font-weight: 700; font-size: .92rem; padding: 11px 22px; border: 1px solid rgba(255,255,255,.45); border-radius: var(--radius-sm);
    background: linear-gradient(135deg, rgba(23,169,255,.82) 0%, rgba(22,86,245,.82) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; filter: none; }
  .linkbtn { background: none; border: 0; padding: 4px 2px; font: inherit; color: var(--accent); cursor: pointer; }
  .linkbtn:disabled { color: var(--ink-faint); cursor: default; }
  #otpStep.hidden { display: none !important; }
  #otp { letter-spacing: .35em; font-size: 1.15rem; }
  #loginErr { color: var(--danger); font-size: .85rem; min-height: 1.3em; text-align: center; }
  #loginErr:not(:empty) { background: var(--danger-soft); border-radius: var(--radius-sm); padding: 8px 10px; font-weight: 500; }

  /* ---------- قاب اصلی: نوار بالا + صفحه‌ی کامل پنل ---------- */
  #appView { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
  .topbar {
    flex: none; height: var(--bar-h); display: flex; align-items: center; gap: 10px; padding: 0 14px;
    padding-top: env(safe-area-inset-top, 0px); height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
    border-width: 0 0 1px 0; border-radius: 0; z-index: 20;
  }
  /* در RTL اولین فرزند سمت راست است: همبرگر سمت راست می‌ماند */
  #menuBtn {
    width: 42px; height: 42px; flex: none; padding: 0; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    box-shadow: var(--shadow-card); transition: border-color .15s, background .15s;
  }
  #menuBtn:hover { border-color: var(--accent); background: var(--accent-soft); }
  #menuBtn span { display: block; width: 20px; height: 2.5px; border-radius: 2px; background: var(--accent-strong); transition: transform .2s, opacity .2s; }
  #menuBtn[aria-expanded="true"] span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  #menuBtn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  #menuBtn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand img { width: 40px; height: 40px; object-fit: contain; flex: none; filter: drop-shadow(0 4px 6px rgba(15,72,150,.25)); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .brand-text b { font-size: 1rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .brand-text small { font-size: .75rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #userPill { font-size: .78rem; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; white-space: nowrap; }
  .icon-btn {
    width: 40px; height: 40px; padding: 0; flex: none; border-radius: 50%;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center; transition: border-color .15s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg { width: 19px; height: 19px; }
  #themeBtn .icon-sun { display: none; }
  html[data-theme="dark"] #themeBtn .icon-sun { display: block; }
  html[data-theme="dark"] #themeBtn .icon-moon { display: none; }
  #logoutBtn { height: 40px; padding: 0 16px; border-radius: 20px; font-size: .82rem; font-weight: 700; color: var(--danger);
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); transition: background .15s, border-color .15s; }
  #logoutBtn:hover { background: var(--danger-soft); border-color: var(--danger); }

  /* صفحه‌ی «سرور قطع است» */
  #downView { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(12,18,38,.97); color: #EAF0FB; text-align: center; }
  #downView .down-card { width: 100%; max-width: 420px; }
  #downView img { width: min(360px, 86%); height: auto; background: #fff; border-radius: 22px; padding: 14px;
    box-shadow: 0 24px 60px -16px rgba(0,0,0,.6); }
  #downView h2 { margin: 20px 0 6px; font-size: 1.25rem; font-weight: 700; }
  #downView p { margin: 0; color: rgba(234,240,251,.7); font-size: .92rem; line-height: 1.9; }
  #downView .dots { display: flex; gap: 7px; justify-content: center; margin-top: 16px; }
  #downView .dots i { width: 8px; height: 8px; border-radius: 50%; background: #17A9FF; animation: downPulse 1.2s infinite ease-in-out; }
  #downView .dots i:nth-child(2) { animation-delay: .2s; } #downView .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes downPulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { #downView .dots i { animation: none; opacity: .7; } }
  #netWarn { flex: none; background: var(--amber-soft); color: var(--amber); font-size: .82rem; font-weight: 500; padding: 7px 14px; text-align: center; }

  /* صفحه‌ی کامل پنل: هر بار فقط یک پنل دیده می‌شود */
  #viewport { flex: 1; min-height: 0; position: relative; }
  #viewport iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }

  /* ---------- منوی کشویی (سمت راست) ---------- */
  #scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; bottom: 0; right: 0; z-index: 50; width: min(330px, 86vw);
    display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; padding-top: calc(18px + env(safe-area-inset-top, 0px));
    background: var(--surface-strong);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border-left: 1px solid var(--line); box-shadow: var(--shadow-float);
    border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    transform: translateX(105%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s .28s;
  }
  #drawer.open { transform: translateX(0); visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 16px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .drawer-head img { width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(15,72,150,.28)); }
  .drawer-head b { display: block; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
  .drawer-head small { color: var(--ink-soft); font-size: .76rem; }
  .nav-item {
    position: relative; width: 100%; display: flex; align-items: center; gap: 12px; text-align: right;
    padding: 12px 14px; border-radius: var(--radius); border: 1px solid transparent; background: transparent; color: var(--ink);
    transition: background .15s, border-color .15s;
  }
  .nav-item:hover { background: var(--accent-soft); }
  .nav-item .ico { width: 38px; height: 38px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: var(--surface-tint); border: 1px solid var(--line); color: var(--accent-strong); }
  .nav-item .ico svg { width: 20px; height: 20px; }
  .nav-item .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .nav-item .t b { font-size: .95rem; font-weight: 700; }
  .nav-item .t span { font-size: .75rem; color: var(--ink-soft); font-weight: 400; line-height: 1.6; }
  .nav-item[aria-current="page"] { background: var(--accent-soft); border-color: var(--line); }
  .nav-item[aria-current="page"] .ico { background: linear-gradient(135deg, rgba(23,169,255,.85), rgba(22,86,245,.85)); color: #fff; border-color: rgba(255,255,255,.45); }
  .nav-item[aria-current="page"]::before { content: ""; position: absolute; right: -14px; top: 22%; bottom: 22%; width: 4px; border-radius: 4px 0 0 4px; background: linear-gradient(var(--accent), var(--accent-deep)); }

  @media (max-width: 560px) {
    #userPill { display: none; }
    .brand-text small { max-width: 42vw; }
    #logoutBtn { padding: 0 12px; }
  }
  @media (max-width: 380px) { .brand img { display: none; } }
</style>
<script src="config.js"></script>
</head>

};
const PANELS = [
  { id: 'estelam',     title: 'استعلام البرز (سنهاب)', desc: 'استعلام بیمه‌نامه ثالث و جزئیات آن',         url: 'panels/estelam/index.html' },
  { id: 'tarikhche',   title: 'تاریخچه خوان', desc: 'محاسبه‌ی تخفیف قابل انتقال پلاک',            url: 'panels/tarikhche/index.html' },
  { id: 'endorsement', title: 'الحاقیه ایران',  desc: 'حذف تخفیفات و اصلاح مشخصات مالک/بیمه‌گذار', url: 'panels/endorsement/index.html' },
];

const $ = id => document.getElementById(id);
const loginView = $('loginView'), appView = $('appView'), viewport = $('viewport');
const menuBtn = $('menuBtn'), drawer = $('drawer'), scrim = $('scrim'), navList = $('navList');
let current = null;
let ALLOWED = null;                                  // null = همه‌ی پنل‌ها؛ وگرنه آرایه‌ی id پنل‌های مجاز این کاربر
const isAllowed = id => !ALLOWED || ALLOWED.includes(id);
const firstAllowed = () => (PANELS.find(p => isAllowed(p.id)) || PANELS[0]).id;
function applyPanels(list){
  ALLOWED = Array.isArray(list) && list.length ? list : null;
  navList.querySelectorAll('.nav-item').forEach(b => { b.style.display = isAllowed(b.dataset.id) ? '' : 'none'; });
}

const getToken   = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } };
const setToken   = t  => { try { localStorage.setItem(TOKEN_KEY, t); } catch(e){} };
const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch(e){} };

/* ---------- تم ---------- */
const currentTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
function syncFrameTheme(f){
  try { f.contentDocument.documentElement.setAttribute('data-theme', currentTheme()); } catch(e){}
}
$('themeBtn').addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  viewport.querySelectorAll('iframe').forEach(syncFrameTheme);
});

/* ---------- منوی کشویی ---------- */
function openMenu(){
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); scrim.classList.add('show');
  menuBtn.setAttribute('aria-expanded', 'true');
  const active = navList.querySelector('[aria-current="page"]') || navList.querySelector('button');
  if (active) active.focus({ preventScroll: true });
}
function closeMenu(returnFocus){
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); scrim.classList.remove('show');
  menuBtn.setAttribute('aria-expanded', 'false');
  if (returnFocus) menuBtn.focus({ preventScroll: true });
}
menuBtn.addEventListener('click', () => drawer.classList.contains('open') ? closeMenu() : openMenu());
scrim.addEventListener('click', () => closeMenu(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeMenu(true); });

PANELS.forEach(p => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'nav-item'; b.dataset.id = p.id;
  b.innerHTML = `<span class="ico">${ICONS[p.id]}</span><span class="t"><b>${p.title}</b><span>${p.desc}</span></span>`;
  b.addEventListener('click', () => { selectPanel(p.id); closeMenu(true); });
  navList.appendChild(b);
});

/* ---------- نمایش یک پنل به‌صورت صفحه‌ی کامل ---------- */
function selectPanel(id){
  const p = PANELS.find(x => x.id === id && isAllowed(x.id)) || PANELS.find(x => isAllowed(x.id)) || PANELS[0];
  current = p.id;
  PANELS.forEach(x => {
    const f = viewport.querySelector(`iframe[data-id="${x.id}"]`);
    if (f) f.classList.toggle('hidden', x.id !== p.id);
  });
  let frame = viewport.querySelector(`iframe[data-id="${p.id}"]`);
  if (!frame) {                                   // lazy: فقط بار اول ساخته می‌شود (و بعدش حالت صفحه حفظ می‌شود)
    frame = document.createElement('iframe');
    frame.dataset.id = p.id; frame.title = p.title;
    frame.addEventListener('load', () => syncFrameTheme(frame));
    frame.src = p.url + (p.url.includes('?') ? '&' : '?') + 't=' + Date.now();   // همیشه نسخه‌ی جدید پنل (کش مرورگر/گیت‌هاب نادیده گرفته می‌شود)
    viewport.appendChild(frame);
  }
  navList.querySelectorAll('.nav-item').forEach(b => {
    if (b.dataset.id === p.id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('curPanel').textContent = p.title;
}
function resetPanels(){ viewport.replaceChildren(); current = null; }

/* ---------- قطع بودن سرور: نمایش تصویر + تلاش خودکار تا وصل شدن ---------- */
let isDown = false, downTimer = null;
async function pingServer(){                          // gateway + سرویس لاگین هر دو باید زنده باشند
  try { const r = await fetch(API + '/auth/health', { cache: 'no-store' }); return r.ok; }
  catch(e) { return false; }
}
async function refreshConfig(){                       // آدرس تونل ممکن است عوض شده باشد: config.js را از شبکه می‌گیرد
  try {                                               // ('reload' کش مرورگر را هم تازه می‌کند، پس پنل‌های داخل iframe هم آدرس جدید را می‌گیرند)
    const r = await fetch('config.js', { cache: 'reload' });
    if (!r.ok) return;
    const m = (await r.text()).match(/API_BASE\s*:\s*["']([^"']+)["']/);
    const fresh = m && m[1].replace(/\/+$/, '');
    if (fresh && fresh !== API) {
      window.APP_CONFIG = Object.assign({}, window.APP_CONFIG, { API_BASE: fresh });
      API = fresh; AUTH = API + '/auth/api';
    }
  } catch(e) {}
}
function showDown(){
  if (isDown) return;
  isDown = true;
  $('downView').classList.remove('hidden');
  downTimer = setInterval(async () => {
    await refreshConfig();
    if (!(await pingServer())) return;
    let stamps = [];                                  // جلوگیری از رفرش بی‌نهایت: حداکثر ۳ رفرش خودکار در هر دقیقه
    try { stamps = JSON.parse(sessionStorage.getItem('recoverTs') || '[]').filter(t => Date.now() - t < 60000); } catch(e) {}
    if (stamps.length >= 3) {
      clearInterval(downTimer); isDown = false;
      $('downView').classList.add('hidden');
      showLogin('ارتباط با سرور برقرار نشد.');
      return;
    }
    stamps.push(Date.now());
    try { sessionStorage.setItem('recoverTs', JSON.stringify(stamps)); } catch(e) {}
    location.reload();
  }, 5000);
}

/* ---------- ورود / خروج ---------- */
function showLogin(msg){
  backToCreds();
  appView.classList.add('hidden');
  loginView.classList.remove('hidden');
  resetPanels();                       // iframeها را پاک می‌کند تا بعد از خروج چیزی باز نماند
  closeMenu();
  $('password').value = '';
  $('loginErr').textContent = msg || '';
}
function showApp(me){
  loginView.classList.add('hidden');
  appView.classList.remove('hidden');
  $('userPill').textContent = (me.username || '') + (me.role === 'admin' ? ' · مدیر' : ' · کاربر');
  applyPanels(me.panels);
  if (!current) selectPanel(isAllowed(DEFAULT_PANEL) ? DEFAULT_PANEL : firstAllowed());
}

// برمی‌گرداند: شیء کاربر | null (توکن نامعتبر) | undefined (خطای شبکه)
async function checkSession(){
  const token = getToken();
  if (!token) return null;
  try {
    const r = await fetch(AUTH + '/me', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
    if (r.ok) return await r.json();
    if (r.status === 401) { clearToken(); return null; }
    return undefined;
  } catch(e) { return undefined; }
}

/* ---------- مرحله‌ی دوم: کد ایمیلی ---------- */
let otpToken = '', resendTimer = null;
function startResendCountdown(sec){
  const b = $('otpResend'); clearInterval(resendTimer); b.disabled = true;
  const tick = () => { if (sec <= 0) { clearInterval(resendTimer); b.disabled = false; b.textContent = 'ارسال دوباره‌ی کد'; }
                       else b.textContent = 'ارسال دوباره‌ی کد (' + (sec--) + ' ثانیه)'; };
  tick(); resendTimer = setInterval(tick, 1000);
}
function showOtpStep(d){
  otpToken = d.otp_token;
  $('credStep').classList.add('hidden'); $('credStep').style.display = 'none';
  $('otpStep').classList.remove('hidden');
  $('username').required = false; $('password').required = false;
  $('otpHint').textContent = 'کد تأیید به ' + (d.email_hint || 'ایمیل شما') + ' ارسال شد.';
  $('otp').value = ''; $('loginBtn').textContent = 'تأیید و ورود';
  startResendCountdown(60); $('otp').focus();
}
function backToCreds(){
  otpToken = ''; clearInterval(resendTimer);
  $('otpStep').classList.add('hidden');
  $('credStep').classList.remove('hidden'); $('credStep').style.display = 'contents';
  $('username').required = true; $('password').required = true;
  $('otp').value = ''; $('loginBtn').textContent = 'ورود';
}
$('otpBack').addEventListener('click', () => { backToCreds(); $('loginErr').textContent = ''; $('password').value = ''; });
$('otpResend').addEventListener('click', async () => {
  const err = $('loginErr'); err.textContent = '';
  try {
    const r = await fetch(AUTH + '/login/otp/resend', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp_token: otpToken }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { startResendCountdown(60); return; }
    if (d.error === 'otp_cooldown') { startResendCountdown(d.retry_after || 60); return; }
    if (d.error === 'otp_expired' || d.error === 'otp_locked') { backToCreds(); err.textContent = 'مهلت کد تمام شد؛ دوباره وارد شوید.'; return; }
    err.textContent = 'ارسال دوباره‌ی کد ناموفق بود.';
  } catch(e) { err.textContent = 'ارتباط با سرور برقرار نشد.'; }
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('loginErr'), btn = $('loginBtn');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی...';
  try {
    if (otpToken) {                                   // مرحله‌ی ۲: تأیید کد
      const r = await fetch(AUTH + '/login/otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp_token: otpToken, code: $('otp').value.trim() }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { setToken(d.token); backToCreds(); showApp({ username: d.username, role: d.role, panels: d.panels }); return; }
      if (d.error === 'otp_expired' || d.error === 'otp_locked') {
        backToCreds(); err.textContent = d.error === 'otp_locked' ? 'تلاش‌های اشتباه زیاد بود؛ چند دقیقه بعد دوباره امتحان کنید.' : 'مهلت کد تمام شد؛ دوباره وارد شوید.'; return;
      }
      if (r.status === 429) { err.textContent = 'درخواست‌های زیاد؛ چند لحظه بعد دوباره امتحان کنید.'; return; }
      if (r.status >= 500) { err.textContent = 'تأیید کد ممکن نشد؛ کمی بعد دوباره امتحان کنید.'; return; }
      err.textContent = 'کد اشتباه یا منقضی شده است' + (d.attempts_left != null ? ' (' + d.attempts_left + ' تلاش باقی مانده)' : '') + '.';
      $('otp').select();
      return;
    }
    const r = await fetch(AUTH + '/login', {          // مرحله‌ی ۱: نام کاربری و رمز
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
    });
    if (r.status === 429) { err.textContent = 'تلاش‌های ناموفق زیاد بود؛ چند لحظه بعد دوباره امتحان کنید.'; return; }
    if (r.status === 401) { err.textContent = 'نام کاربری یا رمز عبور اشتباه است.'; return; }
    if (!r.ok) { err.textContent = 'ارسال کد تأیید ناموفق بود؛ کمی بعد دوباره امتحان کنید.'; return; }
    const d = await r.json();
    if (d.otp_required) { $('password').value = ''; showOtpStep(d); return; }
    setToken(d.token);
    showApp({ username: d.username, role: d.role, panels: d.panels });
  } catch(ex) {
    err.textContent = 'ارتباط با سرور برقرار نشد.'; showDown();
  } finally {
    btn.disabled = false; btn.textContent = otpToken ? 'تأیید و ورود' : 'ورود';
  }
});

$('logoutBtn').addEventListener('click', async () => {
  try { await fetch(AUTH + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + getToken() } }); } catch(e){}
  clearToken();
  showLogin();
});

window.addEventListener('message', async ev => {      // پنل‌ها (هم‌مبدأ) هنگام 401 خبر می‌دهند
  if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'auth-expired') return;
  if (appView.classList.contains('hidden')) return;
  const m = await checkSession();
  if (m === null) showLogin('نشست شما تمام شد؛ دوباره وارد شوید.');
});

(async function init(){
  await refreshConfig();
  const me = (await pingServer()) ? await checkSession() : undefined;   // undefined = سرور در دسترس نیست
  if (me) showApp(me);
  else if (me === undefined) showDown();
  else showLogin('');
  // نشست ۱۲ ساعته؛ هر دقیقه چک می‌کنیم. خطای موقت شبکه کاربر را بیرون نمی‌اندازد.
  setInterval(async () => {
    if (appView.classList.contains('hidden')) return;
    const m = await checkSession();
    $('netWarn').classList.toggle('hidden', m !== undefined);
    if (m === null) showLogin('نشست شما تمام شد؛ دوباره وارد شوید.');
  }, 60000);
  // پایش اتصال: هر ۱۵ ثانیه؛ دو بار پشت‌سرهم شکست = نمایش صفحه‌ی «سرور قطع است»
  setInterval(async () => {
    if (isDown) return;
    if (await pingServer()) return;
    await new Promise(r => setTimeout(r, 2500));
    if (!(await pingServer())) showDown();
  }, 15000);
})();
</script>
