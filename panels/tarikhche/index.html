<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/status/gate.js" data-app="tarikhche" defer></script>  <!-- کلید روشن/خاموش (حالت تعمیر) از صفحه‌ی وضعیت -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تاریخچه‌خوانی</title>
<script src="../../config.js"></script>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('tarikhcheTheme');
      var theme = saved === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/img-65129cbc.png">
<link rel="icon" type="image/png" sizes="64x64" href="../../assets/img-d51d88c2.png">
<link rel="apple-touch-icon" href="../../assets/img-a8d09a7b.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: rgba(255,255,255,.72);
    --surface-tint: rgba(217,236,255,.55);
    --ink: #0F1B33;
    --ink-soft: rgba(15,27,51,.68);
    --ink-faint: rgba(15,27,51,.46);
    --line: rgba(23,169,255,.32);
    --accent: #17A9FF;
    --accent-deep: #1656F5;
    --accent-soft: rgba(23,169,255,.20);
    --accent-strong: #0D6FCB;
    --danger: #E0453F;  --danger-soft: rgba(224,69,63,.16);
    --success: #1FA971; --success-soft: rgba(31,169,113,.16);
    --amber: #B96A0C;   --amber-soft: rgba(224,138,23,.16);
    --row-alt: rgba(255,255,255,.35);
    --row-hover: rgba(23,169,255,.12);
    --option-bg: #ffffff;
    --radius-lg: 20px; --radius: 14px; --radius-sm: 9px;
    --glass-blur: 18px;
    --shadow-card: 0 8px 28px rgba(15,72,150,.14), inset 0 1px 0 rgba(255,255,255,.6);
    --shadow-float: 0 24px 55px -14px rgba(15,72,150,.22), inset 0 1px 0 rgba(255,255,255,.7);
    --font: 'Vazirmatn', Tahoma, Arial, sans-serif;
  }
  html[data-theme="dark"] {
    --surface: rgba(255,255,255,.07);
    --surface-tint: rgba(255,255,255,.04);
    --ink: #EAF0FB;
    --ink-soft: rgba(234,240,251,.68);
    --ink-faint: rgba(234,240,251,.44);
    --line: rgba(255,255,255,.14);
    --accent-deep: #4C8DFF;
    --accent-soft: rgba(23,169,255,.22);
    --accent-strong: #3AA0FF;
    --danger: #FF6B64;  --danger-soft: rgba(255,107,100,.18);
    --success: #34C98C; --success-soft: rgba(52,201,140,.18);
    --amber: #F2A93B;   --amber-soft: rgba(242,169,59,.18);
    --row-alt: rgba(255,255,255,.03);
    --row-hover: rgba(23,169,255,.14);
    --option-bg: #141b2e;
    --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    --shadow-float: 0 24px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--font); background: #0c1226; margin: 0; padding: 20px; color: var(--ink); font-size: 14px; min-height: 100vh; transition: color .25s ease; }

  /* پس‌زمینه‌ی گرادیانی ثابت پشت کادرهای شیشه‌ای */
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(23,169,255,.55), transparent 62%),
      radial-gradient(680px 540px at 106% 6%, rgba(124,92,224,.4), transparent 62%),
      radial-gradient(700px 560px at 88% 102%, rgba(255,105,170,.32), transparent 62%),
      radial-gradient(640px 520px at 4% 104%, rgba(31,169,113,.3), transparent 62%),
      linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
    animation: glow-shift 24s ease-in-out infinite;
  }
  html[data-theme="dark"] .bg-glow {
    background:
      radial-gradient(620px 520px at 12% -8%, rgba(23,169,255,.32), transparent 60%),
      radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.28), transparent 60%),
      radial-gradient(700px 560px at 88% 102%, rgba(156,135,240,.26), transparent 60%),
      radial-gradient(640px 520px at 4% 104%, rgba(52,201,140,.2), transparent 60%),
      linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
  }
  @keyframes glow-shift { 0%, 100% { filter: saturate(1) hue-rotate(0deg); } 50% { filter: saturate(1.18) hue-rotate(10deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .bg-glow, .panel { animation: none !important; } }

  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
  .sub { color: var(--ink-soft); margin: 0 0 18px; font-size: .85rem; text-align: center; }

  /* کادر شیشه‌ای */
  .panel {
    background: var(--surface);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-card);
    animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  .panel h2 { font-size: .95rem; font-weight: 700; margin: 0 0 12px; color: var(--ink); }
  .fields { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }
  .field.sm { flex: 0 1 120px; min-width: 90px; }
  label { font-size: .8rem; font-weight: 500; color: var(--ink-soft); }

  select, input {
    padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-size: .9rem; font-family: inherit; color: var(--ink); width: 100%; direction: ltr; text-align: center;
    background: var(--surface-tint);
    -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
    outline: none; transition: border-color .15s, background .15s, box-shadow .15s;
  }
  select:focus, input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
  input::placeholder { color: var(--ink-faint); }
  input:-webkit-autofill { -webkit-text-fill-color: var(--ink) !important; -webkit-box-shadow: 0 0 0 1000px var(--surface-tint) inset !important; transition: background-color 9999s ease-in-out 0s !important; }
  .search-panel .field label { text-align: center; }
  .plate-block { margin: 0 0 16px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .plate-block > label { font-weight: 700; color: var(--ink); font-size: .85rem; }
  /* ترتیب چپ‌به‌راست مثل خود پلاک: دو رقم - حرف - سه رقم - سریال؛ ترتیب Tab و پرش خودکار هم همین است */
  .plate-row { display: flex; gap: 8px; direction: ltr; }
  .plate-row input, .plate-row select { width: 72px; height: 46px; padding: 8px 4px; font-size: .9rem; }
  /* «ایران» بالای دو رقم سمت راست (سریال)؛ فقط ظاهر است و خود فیلد #sr تغییری نکرده */
  .plate-row { align-items: center; }
  .sr-box { position: relative; display: block; }
  .plate-row input#sr { padding-top: 19px; padding-bottom: 7px; }
  .iran-label { position: absolute; z-index: 1; top: 7px; left: 50%; width: 46px; height: 8px; transform: translateX(-50%); pointer-events: none;
    background-color: var(--ink); -webkit-mask: url("../../assets/img-03db0db6.png") center / 100% 100% no-repeat; mask: url("../../assets/img-03db0db6.png") center / 100% 100% no-repeat; }
  .plate-row select { width: 72px; appearance: none; -webkit-appearance: none; cursor: pointer; font-weight: 700;
    background: var(--surface-tint) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236b7280'/></svg>") no-repeat 7px center;
    padding: 8px 6px 8px 20px; text-align-last: center; }
  /* کد ملی و کد رهگیری: کنار هم، هرکدام به عرض کل کادرهای پلاک (۴×۷۲ + ۳×۸ = ۳۱۲)؛ در صفحه‌ی باریک زیر هم می‌روند */
  .search-panel .fields { justify-content: center; gap: 12px 24px; }
  .search-panel .field { flex: 0 1 312px; min-width: 0; }
  .search-panel .field input { height: 46px; }
  /* عنوان «پلاک ملی» کنار پلاک می‌ماند ولی جای پلاک را جابه‌جا نمی‌کند تا لبه‌ی پلاک و کادرهای زیرش دقیقاً هم‌تراز باشد */
  .plate-block { position: relative; }
  .plate-block > label { position: absolute; left: calc(50% + 168px); white-space: nowrap; }
  @media (max-width: 640px) { .plate-block { flex-direction: column; } .plate-block > label { position: static; } }
  select option { color: var(--ink); background: var(--option-bg); font-weight: 400; }

  /* دکمه‌ها: شیشه‌ی گرادیانی */
  button {
    font-family: inherit; cursor: pointer; color: #fff; font-weight: 700; font-size: .9rem;
    padding: 10px 22px; border: 1px solid rgba(255,255,255,.45); border-radius: var(--radius-sm);
    background: linear-gradient(135deg, rgba(23,169,255,.65) 0%, rgba(22,86,245,.65) 100%);
    -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; filter: none; }
  .go { display: block; width: auto; margin: 14px auto 0; padding: 11px 18px; font-size: .85rem; border-radius: 18px; border-color: rgba(255,255,255,.6); box-shadow: 0 6px 18px -8px rgba(22,86,245,.45), inset 0 1px 0 rgba(255,255,255,.55); }

  .status { margin: 8px 2px; font-size: .85rem; color: var(--ink-soft); }
  .status.error { color: var(--danger); background: var(--danger-soft); border-radius: var(--radius-sm); padding: 10px 12px; font-weight: 500; }
  .status.loading { color: var(--accent-strong); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--success-soft); color: var(--success); }
  .badge.review { background: var(--amber-soft); color: var(--amber); }
  .panel-head { display: flex; align-items: center; justify-content: center; text-align: center; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  /* تیتر نتیجه + وضعیت (قطعی) داخل یک کادر */
  .panel-head { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-tint); padding: 10px 14px; }
  .announce-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .discount-box { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; background: var(--surface-tint); text-align: center; font-size: .85rem; line-height: 1.7; }
  .discount-box .dlabel { color: var(--ink-soft); font-weight: 600; }
  .discount-box .dval { color: var(--accent-strong); font-weight: 700; }
  .hint.center { text-align: center; margin: -4px 0 10px; }
  .info-row { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 14px; text-align: center; }
  .script-title { font-size: .9rem; font-weight: 700; margin: 14px 0 8px; color: var(--ink); text-align: center; }
  .info-row .kv { margin: 0; font-size: 1.05rem; }
  .info-row .kv b { font-size: 1.15rem; }
  .kv { margin: 3px 0; color: var(--ink-soft); font-size: .85rem; }
  .kv b { color: var(--ink); direction: ltr; unicode-bidi: plaintext; }

  .hint { font-size: .72rem; color: var(--amber); margin-top: 6px; }
  li.endorse { color: var(--amber); font-weight: 600; }
  .announce-text { background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 12px 14px; line-height: 2; font-weight: 600; color: var(--ink); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .announce-text span { flex: 1; }
  .announce-text button { padding: 6px 14px; font-size: .8rem; white-space: nowrap; }
  .announce-text button.copied { background: linear-gradient(135deg, rgba(31,169,113,.8), rgba(31,169,113,.65)); }

  .warn { background: var(--amber-soft); color: var(--amber); border-radius: var(--radius-sm); padding: 8px 12px; margin: 6px 0; font-size: .85rem; font-weight: 500; }

  .details-bar { margin: 0 0 16px; text-align: center; }
  .details-toggle { color: var(--accent-strong); background: var(--surface); border: 1px solid var(--accent); padding: 6px 16px; font-size: .85rem; box-shadow: var(--shadow-card); }
  .details-toggle:hover { background: var(--accent-soft); }
  .details-toggle .arrow { display: inline-block; margin-inline-start: 6px; transition: transform .2s; }
  .details-toggle[aria-expanded="true"] .arrow { transform: rotate(180deg); }
  .details-body { display: none; }
  .details-body.open { display: block; }

  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; background: var(--surface-tint); }
  table.policy-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.policy-table thead th { background: rgb(28,128,250); color: #fff; font-weight: 600; padding: 9px 8px; text-align: right; white-space: nowrap; }
  table.policy-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; text-align: right; background: transparent; }
  tr.policy-row:nth-child(even) td { background: var(--row-alt); }
  tr.policy-row:hover td { background: var(--row-hover); }
  .num { direction: ltr; unicode-bidi: plaintext; text-align: right; }
  .strong { font-weight: 700; color: var(--accent-strong); }
  tr.sub-row td { padding: 6px 10px; font-size: .75rem; }
  tr.damage-row td { background: var(--danger-soft); color: var(--danger); }
  tr.endorsement-row td { background: var(--amber-soft); color: var(--amber); }
  .print-btn { font: inherit; font-weight: 700; color: inherit; background: transparent; border: 1px dashed currentColor; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  .print-btn:disabled { opacity: .6; cursor: wait; }
  @media print { .print-btn { display: none; } }
  .sub-label { font-weight: 700; margin-left: 4px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .72rem; background: var(--accent-soft); color: var(--accent-strong); }
  .chip.exp { background: rgba(128,128,128,.18); color: var(--ink-soft); }

  .car { border-top: 1px solid var(--line); padding: 10px 0; }
  .car:first-of-type { border-top: 0; }
  .car.best { background: var(--success-soft); border-radius: var(--radius-sm); margin: 0 -8px; padding: 10px 8px; }
  .car small { display: block; color: var(--ink-soft); }
  .car b.ltr { direction: ltr; unicode-bidi: plaintext; color: var(--ink); }

  /* دکمه‌ی تغییر تم (روشن/تاریک) */
  .upload-btn { position: static; width: auto; height: 38px; padding: 0 16px; margin: 10px auto 16px; border-radius: 19px; cursor: pointer;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: .85rem; font-weight: 600; backdrop-filter: blur(var(--glass-blur)); }
  .upload-btn:hover { border-color: var(--accent); }
  .upload-btn:disabled { opacity: .6; cursor: wait; }
  .upload-btn svg { width: 18px; height: 18px; }
  @media print { .upload-btn { display: none !important; } }
  .theme-toggle { position: fixed; bottom: 16px; left: 16px; z-index: 9999; width: 42px; height: 42px; padding: 0; border-radius: 50%;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center; }
  .theme-toggle svg { width: 20px; height: 20px; }
  .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* لودینگ تمام‌صفحه: صفحه تار می‌شود و اسپینر می‌چرخد تا نتیجه آماده شود */
  .loading-overlay { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center;
    background: rgba(240,246,255,.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: progress; }
  html[data-theme="dark"] .loading-overlay { background: rgba(8,12,24,.55); }
  .loading-overlay.show { display: flex; animation: lo-fade .2s ease-out; }
  .loading-card { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: min(90vw, 360px); text-align: center; }
  .spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid var(--accent-soft); border-top-color: var(--accent-strong);
    animation: lo-spin .9s linear infinite; }
  .loading-text { font-weight: 700; font-size: 1rem; color: var(--ink); text-shadow: 0 0 10px var(--surface), 0 0 4px var(--surface); }
  .loading-sub { font-size: .8rem; color: var(--ink-soft); text-shadow: 0 0 10px var(--surface), 0 0 4px var(--surface); }
  .loading-sub:empty { display: none; }
  @keyframes lo-spin { to { transform: rotate(360deg); } }
  @keyframes lo-fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  @media print { .loading-overlay { display: none !important; } }

  .print-title { display: none; }
  @media print {
    :root, html[data-theme="dark"] {
      --surface: #fff; --surface-tint: #fff; --ink: #111; --ink-soft: #444; --ink-faint: #666; --line: #ccd6e0;
      --accent-strong: #0a4276; --danger: #b91c1c; --danger-soft: #fef2f2; --amber: #92400e; --amber-soft: #fffbeb;
      --success: #15803d; --success-soft: #ecfdf5; --accent-soft: #e8f1fa; --row-alt: #fafcfe; --row-hover: #fff;
    }
    body { background: #fff !important; padding: 0; font-size: 11px; }
    .bg-glow, .theme-toggle { display: none !important; }
    .search-panel, #status, #server, button, .hint, .details-bar { display: none !important; }
    .details-body { display: block !important; }
    .container { max-width: 100%; }
    .sub { display: none; }
    .print-title { display: block; font-size: 1rem; margin: 0 0 10px; text-align: center; color: #111; }
    .panel { box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; animation: none; }
    .announce-text, tr.damage-row td, tr.endorsement-row td, table.policy-table thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.policy-row, tr.sub-row { break-inside: avoid; }
    @page { size: A4 landscape; margin: 10mm; }
  }
select.need { outline: 2px solid #e5484d; outline-offset: 2px; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="loading-overlay" id="loading" role="status" aria-live="polite" aria-busy="true">
  <div class="loading-card">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text" id="loadingText">در حال پردازش…</div>
    <div class="loading-sub" id="loadingSub"></div>
  </div>
</div>
<button type="button" class="theme-toggle" id="themeToggleBtn" title="تغییر تم" aria-label="تغییر تم روشن یا تاریک">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
<input type="file" id="historyFile" accept=".pdf,application/pdf,image/*" hidden>
<div class="container">
  <p class="sub">محاسبه‌ی خودکار تخفیف قابل انتقال به مالک پلاک</p>

  <div id="server"></div>

  <div class="panel search-panel">
    <div class="plate-block">
      <label>پلاک ملی</label>
      <div class="plate-row">
        <input id="l2" inputmode="numeric" maxlength="2" placeholder="12" title="دو رقم سمت چپ" aria-label="دو رقم سمت چپ" autocomplete="off">
        <select id="lt" title="حرف پلاک" aria-label="حرف پلاک"></select>
        <input id="r3" inputmode="numeric" maxlength="3" placeholder="345" title="سه رقم سمت راست" aria-label="سه رقم سمت راست" autocomplete="off">
        <span class="sr-box"><i class="iran-label" aria-hidden="true"></i><input id="sr" inputmode="numeric" maxlength="2" placeholder="67" title="سریال (ایران)" aria-label="سریال (ایران)" autocomplete="off"></span>
      </div>
    </div>
    <div class="fields">
      <div class="field"><label for="nc">کد ملی</label><input id="nc" inputmode="numeric" maxlength="10" autocomplete="off"></div>
      <div class="field"><label for="tc">کد رهگیری</label><input id="tc" inputmode="numeric" autocomplete="off"></div>
    </div>
    <button id="go" class="go">استعلام و محاسبه</button>
  </div>

  <button type="button" class="upload-btn" id="uploadBtn" title="فایل PDF یا اسکرین‌شات برگه‌ی استعلام را بارگذاری کن (یا اسکرین‌شات را همین‌جا Ctrl+V کن) تا کد ملی، کد رهگیری و پلاک خودکار پر شود">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span>بارگذاری تاریخچه / اسکرین‌شات</span>
  </button>

  <div id="status"></div>
  <div class="print-title" id="printTitle"></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// اگر صفحه از خود سرور پایتون باز شده باشد آدرس نسبی است؛ اگر از GitHub Pages باز شده باشد به سرور روی همین لپ‌تاپ وصل می‌شود.
// پورت را اینجا عوض کن اگر برنامه را با --port دیگری اجرا می‌کنی.
// حالت‌ها:
//  1) باز شدن مستقیم از سرور پایتون (127.0.0.1 / localhost): آدرس نسبی، بدون توکن.
//  2) داخل پنل یکپارچه (GitHub Pages): آدرس تونل از config.js (همان که صفحه‌ی اصلی می‌خواند) + مسیر /tarikhche + توکن ورود.
const IS_LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const TOKEN_KEY = "panel-auth-token";
function tunnelBase() {
  let b = "";
  try { if (window.parent !== window && window.parent.APP_CONFIG) b = window.parent.APP_CONFIG.API_BASE || ""; } catch (e) {}
  if (!b && window.APP_CONFIG) b = window.APP_CONFIG.API_BASE || "";
  return b.replace(/\/+$/, "");
}
const API_BASE = IS_LOCAL ? "" : (tunnelBase() ? tunnelBase() + "/tarikhche" : "");
function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (!IS_LOCAL) { try { const t = localStorage.getItem(TOKEN_KEY); if (t) h["Authorization"] = "Bearer " + t; } catch (e) {} }
  return h;
}

// بررسی اینکه سرور پایتون در حال اجراست
async function checkServer() {
  const box = $("server");
  try {
    if (!IS_LOCAL && !API_BASE) throw new Error("no-config");
    const r = await fetch(API_BASE + "/api/ping", {cache: "no-store", headers: authHeaders()});
    if (r.status === 401) { box.replaceChildren(el("div", "status error", "نشست شما تمام شده؛ صفحه‌ی اصلی را رفرش کنید و دوباره وارد شوید.")); return; }
    if (!r.ok) throw new Error();
    box.replaceChildren();
  } catch (e) {
    box.replaceChildren(el("div", "status error",
      "اتصال به سرور برقرار نشد. مطمئن شوید برنامه روی سیستم میزبان اجراست، بعد صفحه‌ی اصلی را رفرش کنید."));
  }
}
window.addEventListener("focus", checkServer);
"ب الف پ ت ث ج د ر ز ژ س ش ص ط ع ف ق ک گ ل م ن و ه ی ح D S".split(" ")
  .forEach(l => $("lt").add(new Option(l, l)));
$("lt").value = "ب";

// بعد از پر شدن پلاک ← اولین فیلد خالیِ «کد ملی / کد رهگیری»؛ اگر هر دو پر بودند ← دکمه‌ی استعلام و محاسبه
function focusNextEmpty() {
  const empty = [$("nc"), $("tc")].find(x => !x.value.trim());
  (empty || $("go")).focus();
}
// با پر شدن کد ملی (۱۰ رقم) همین منطق اجرا می‌شود: اگر کد رهگیری خالی است می‌رود روی آن، وگرنه روی دکمه
$("nc").addEventListener("input", () => { if ($("nc").value.length >= $("nc").maxLength) focusNextEmpty(); });
// کد رهگیری طول ثابت ندارد؛ با Enter مستقیم استعلام می‌شود
["nc", "tc"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); }));

// ترتیب پر کردن پلاک: دو رقم ← حرف ← سه رقم ← سریال؛ با پر شدن هر فیلد خودکار به بعدی می‌رود
// حرف پلاک را می‌شود با کیبورد تایپ کرد: کیبورد فارسی (ی/ک عربی و «ا» هم قبول است) یا حتی کیبورد انگلیسی
// (با چیدمان استاندارد فارسی ویندوز: مثلاً کلید F = «ب»)؛ لیست کشویی هم مثل قبل کار می‌کند
const PERSIAN_FIX = {"ي": "ی", "ى": "ی", "ك": "ک", "ا": "الف", "آ": "الف", "أ": "الف", "إ": "الف", "ة": "ه", "ۀ": "ه"};
const KEY_TO_LETTER = {KeyA: "ش", KeyS: "س", KeyD: "ی", KeyF: "ب", KeyG: "ل", KeyH: "الف", KeyJ: "ت", KeyK: "ن", KeyL: "م",
  Semicolon: "ک", Quote: "گ", BracketLeft: "ج", KeyW: "ص", KeyE: "ث", KeyR: "ق", KeyT: "ف", KeyU: "ع", KeyI: "ه", KeyP: "ح",
  KeyX: "ط", KeyC: "ز", KeyV: "ر", KeyN: "د", KeyM: "پ", Comma: "و"};
const PLATE = ["l2", "lt", "r3", "sr"].map($);
PLATE.forEach((f, i) => {
  const next = PLATE[i + 1], prev = PLATE[i - 1];
  if (f.tagName === "SELECT") {
    // انتخاب با ماوس ← رفتن به فیلد بعدی؛ حرکت با فلش‌ها ← همان‌جا می‌ماند تا بشود گشت
    let arrowNav = false;
    f.addEventListener("change", () => { if (!arrowNav && next) next.focus(); });
    f.addEventListener("keydown", e => {
      if (e.key.startsWith("Arrow")) { arrowNav = true; setTimeout(() => arrowNav = false, 0); return; }
      if (e.ctrlKey || e.altKey || e.metaKey || e.key.length !== 1) return;
      // شیفت+D / شیفت+S برای حرف‌های لاتین D و S
      let ch = (e.key === "D" || e.key === "S") ? e.key
             : (PERSIAN_FIX[e.key] || (/[\u0600-\u06FF]/.test(e.key) ? e.key : KEY_TO_LETTER[e.code]));
      if (!ch) return;
      const opt = [...f.options].find(o => o.value === ch);
      e.preventDefault();  // تایپ‌کردن پیش‌فرض select را خاموش می‌کنیم تا دوبار انتخاب نشود
      if (!opt) return;    // حرفی که در لیست نیست نادیده گرفته می‌شود
      f.value = opt.value;
      f.dispatchEvent(new Event("change"));
    });
  } else {
    f.addEventListener("input", () => {
      // ارقام فارسی/عربی هم پذیرفته می‌شود (سرور نرمال می‌کند)؛ غیر رقم حذف می‌شود
      f.value = f.value.replace(/[^0-9\u06F0-\u06F9\u0660-\u0669]/g, "");
      if (f.value.length >= f.maxLength) { next ? next.focus() : focusNextEmpty(); }
    });
    f.addEventListener("keydown", e => { if (e.key === "Backspace" && !f.value && prev) { e.preventDefault(); prev.focus(); } });
  }
  f.addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const fmtDate = d => (d ? String(d).replace(/-/g, "/") : "-");
const val = v => (v === null || v === undefined || v === "" ? "-" : String(v));
const RULES = {rule1: "قانون اول (کل تخفیف بیمه‌نامه)", rule2: "قانون دوم (۵٪ برای هر سال)", rule2_transfer: "قانون دوم + تبصره انتقال قبلی تخفیف (کل تخفیف آخرین بیمه‌نامه)", rule_chain: "انتقال تخفیف از خودروی قبلیِ همین پلاک (کل تخفیف آخرین بیمه‌نامه)", none: "بدون تخفیف قابل انتقال"};

// ---------- متن اعلام تخفیف ----------
function buildAnnouncement(r) {
  const drvPct = r.driver_percent ?? r.percent, drvYears = r.driver_years ?? r.years;
  if (!(r.percent > 0) && !(drvPct > 0)) return "تخفیف قابل انتقال ندارد";
  const part = (y, p, title) => (y !== null && y !== undefined ? `${y} سال ` : "") + `${p || 0} درصد ${title}`;
  return `${part(r.years, r.percent, "تخفیف ثالث")} ${part(drvYears, drvPct, "تخفیف حوادث راننده")} ` +
         `قابل انتقال از شماره بیمه‌نامه ${r.policy_number || "-"} با شماره شاسی ${r.best_chassis || "-"}` +
         ((r.endorsement_policies || []).length
           ? ` — نیاز به الحاقیه حذف تخفیفات دارد (بیمه‌نامه ${r.endorsement_policies.join("، ")} هنوز جاری است)` : "") +
         (r.short_term_notice ? ` — نکته: ${r.short_term_notice}` : "");
}

// یک کادر کوچک: «تخفیف ثالث: 12 سال 60 درصد»
const discountBox = (title, years, pct) => {
  const b = el("div", "discount-box");
  const has = pct !== null && pct !== undefined;
  const yearsPart = years !== null && years !== undefined ? years + " سال " : "";
  b.append(el("span", "dlabel", title + ":"), document.createTextNode(" "),
           el("span", "dval", has ? yearsPart + pct + " درصد" : "-"));
  return b;
};

function announceCard(r, data) {
  const card = el("div", "panel");

  // تیتر + وضعیت کنار آن
  const head = el("div", "panel-head");
  head.append(el("h2", "", "نتیجه بررسی تخفیفات تاریخچه پلاک"),
    el("span", "badge" + (data.status === "ok" ? "" : " review"), data.status === "ok" ? "قطعی" : "نیاز به بررسی کارشناس"));
  card.append(head);

  const noDiscount = !(r.percent > 0) && !((r.driver_percent ?? r.percent) > 0);
  if (!noDiscount) {
    // شماره بیمه‌نامه (وسط) و زیرش شماره شاسی، بالای کادرهای تخفیف
    const info = el("div", "info-row");
    const kv = (k, v) => { const d = el("div", "kv", k + ": "); d.append(el("b", "", val(v))); return d; };
    info.append(kv("شماره بیمه‌نامه", r.policy_number), kv("شماره شاسی", r.best_chassis));
    card.append(info);

    // دو کادر کنار هم: تخفیف ثالث و تخفیف حوادث راننده
    const grid = el("div", "announce-grid");
    const missing = r.driver_percent === null || r.driver_percent === undefined;
    grid.append(discountBox("تخفیف ثالث", r.years, r.percent),
                discountBox("تخفیف حوادث راننده", missing ? r.years : r.driver_years, missing ? r.percent : r.driver_percent));
    card.append(grid);
    if (missing && r.percent > 0) card.append(el("div", "hint center", "تخفیف راننده از منبع استعلام نشد؛ مقدار ثالث اعلام می‌شود."));
  }
  // وقتی تخفیف قابل انتقال نیست فقط همین کادر اسکریپت انتقالی با متن «تخفیف قابل انتقال ندارد» نمایش داده می‌شود

  // متن قابل کپی
  card.append(el("div", "script-title", "اسکریپت انتقالی"));
  const box = el("div", "announce-text"); const txt = el("span"); const copy = el("button", "", "کپی");
  txt.textContent = buildAnnouncement(r);
  copy.onclick = () => navigator.clipboard.writeText(txt.textContent).then(() => {
    copy.textContent = "کپی شد"; copy.classList.add("copied");
    setTimeout(() => { copy.textContent = "کپی"; copy.classList.remove("copied"); }, 1200);
  }).catch(() => {});
  box.append(txt, copy); card.append(box);

  return card;
}

// ---------- نحوه‌ی محاسبه (داخل «نمایش جزئیات») ----------
function logicPanel(r) {
  const best = r.cars.find(c => c.chassis === r.best_chassis);
  if (!best) return null;
  const wrap = el("div", "panel"); wrap.append(el("h2", "", "نحوه‌ی محاسبه"));
  const ol = el("ol"); ol.style.cssText = "margin:0;padding-inline-start:20px;font-size:.85rem;line-height:1.95";
  ol.append(el("li", "", "قاعده‌ی اعمال‌شده: " + (RULES[best.rule] || best.rule)));
  (best.notes || []).forEach(n => ol.append(el("li", "", n)));
  if ((best.counted_policies || []).length) ol.append(el("li", "", "بیمه‌نامه‌های شمرده‌شده: " + best.counted_policies.join("، ")));
  if (r.short_term_notice) ol.append(el("li", "endorse", "نکته (کوتاه‌مدت): " + r.short_term_notice));
  if ((r.endorsement_policies || []).length)
    ol.append(el("li", "endorse", `بیمه‌نامه ${r.endorsement_policies.join("، ")} هنوز جاری است؛ این تخفیف قابل انتقال است ولی برای انتقال نیاز به الحاقیه حذف تخفیفات دارد.`));
  wrap.append(ol);
  return wrap;
}

// ---------- جدول بیمه‌نامه‌های خودروی مبنا (با ردیف الحاقیه زیر هر بیمه‌نامه) ----------
function policiesTable(car) {
  const wrap = el("div", "panel");
  wrap.append(el("h2", "", "بیمه‌نامه‌های خودروی مبنا"));
  const tw = el("div", "table-wrap"), t = el("table", "policy-table");
  const head = el("tr");
  ["شرکت", "شماره بیمه‌نامه", "تاریخ شروع", "تاریخ پایان", "وضعیت", "تخفیف ثالث", "تخفیف راننده"]
    .forEach(h => head.append(el("th", "", h)));
  const thead = el("thead"); thead.append(head); t.append(thead);
  const tb = el("tbody");
  const counted = new Set(car.counted_policies || []);

  car.policies.forEach(p => {
    const tr = el("tr", "policy-row");
    const num = el("td", "num", p.number); if (counted.has(p.number)) num.classList.add("strong");
    const st = el("td"); st.append(el("span", "chip" + (p.expired ? " exp" : ""), p.expired ? "منقضی" : "معتبر"));
    tr.append(el("td", "", val(p.company)), num, el("td", "num", fmtDate(p.start)), el("td", "num", fmtDate(p.end)), st,
      el("td", "strong", p.endorsement ? "0" : val(p.discount_percent)),
      el("td", "strong", p.endorsement ? "0" : val(p.driver_discount_percent)));
    tb.append(tr);

    const sub = (cls, label, text) => {
      const r = el("tr", "sub-row " + cls), td = el("td"); td.colSpan = 7;
      td.append(el("span", "sub-label", label), document.createTextNode(text)); r.append(td); tb.append(r);
    };
    if (p.other_plate) sub("endorsement-row", "🔗 پلاک دیگر:", `این بیمه‌نامه با پلاک ${p.other_plate} روی همین شاسی صادر شده و تخفیف را ادامه داده است (از استعلام شاسی)`);
    const isIran = (p.company || "").includes("ایران");
    if (p.endorsement) sub("endorsement-row", "📄 الحاقیه:", "حذف تخفیفات — تخفیفات ۰" + (p.endorsement_text ? " — " + p.endorsement_text : ""));
    if (isIran && p.endorsement) {
      const r = el("tr", "sub-row endorsement-row"), td = el("td"); td.colSpan = 7;
      const btn = el("button", "print-btn", "بیمه‌نامه دارای الحاقیه می‌باشد؛ برای دریافت چاپ الحاقیه کلیک کنید");
      btn.type = "button"; btn.onclick = () => fetchEndorsementPrint(p.number, btn);
      td.append(el("span", "sub-label", "🖨️"), btn); r.append(td); tb.append(r);
    } else if (p.needs_print) sub("endorsement-row", "📄 نکته:", "بیمه ایران است؛ برای مشخص شدن حذف تخفیفات، چاپ الحاقیه بیمه‌نامه را دریافت کنید.");
    else if (!p.expired && !p.endorsement) sub("endorsement-row", "📄 نکته:", "بیمه‌نامه هنوز جاری است؛ تخفیف قابل انتقال است ولی نیاز به الحاقیه حذف تخفیفات دارد.");
  });
  t.append(tb); tw.append(t); wrap.append(tw);
  return wrap;
}

async function fetchEndorsementPrint(number, btn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "در حال دریافت الحاقیه…";
  try {
    const res = await fetch(API_BASE + "/api/endorsement-print", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({policyNumber: number})});
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error === "unauthorized" ? "دسترسی/نشست معتبر نیست؛ دوباره وارد شوید" : (j.error || j.message || "خطا " + res.status));
    if (!(j.files || []).length) throw new Error("الحاقیه‌ای برای این بیمه‌نامه پیدا نشد");
    j.files.forEach(f => {
      const bin = atob(f.contentBase64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], {type: f.contentType || "application/pdf"}));
      window.open(url, "_blank");
    });
    btn.textContent = label;
  } catch (e) { btn.textContent = "خطا: " + e.message + " — دوباره کلیک کنید"; }
  btn.disabled = false;
}

function show(data) {
  const out = $("out"); out.replaceChildren();
  const r = data.result;
  out.append(announceCard(r, data));

  if ((r.origin_history_notices || []).length) {
    const o = el("div", "panel"); o.append(el("h2", "", "تاریخچه مبدأ (ایران و کوثر)"));
    r.origin_history_notices.forEach(t => o.append(el("div", "warn", t)));
    out.append(o);
  }

  if ((r.higher_discount_alerts || []).length) {
    const a = el("div", "panel"); a.append(el("h2", "", "هشدار: تخفیف بالاتر روی شاسی دیگر"));
    r.higher_discount_alerts.forEach(t => a.append(el("div", "warn", t)));
    out.append(a);
  }

  if (data.warnings.length) {
    const w = el("div", "panel"); w.append(el("h2", "", "هشدارها"));
    data.warnings.forEach(t => w.append(el("div", "warn", t)));
    out.append(w);
  }

  // همه‌ی جزئیات: نحوه‌ی محاسبه، بیمه‌نامه‌های خودروی مبنا، جزئیات هر خودرو
  const body = el("div", "details-body");
  const logic = logicPanel(r); if (logic) body.append(logic);

  const best = r.cars.find(c => c.chassis === r.best_chassis);
  if (best && best.policies && best.policies.length) body.append(policiesTable(best));

  const cars = el("div", "panel"); cars.append(el("h2", "", "جزئیات هر خودرو"));
  r.cars.forEach(c => {
    const d = el("div", "car" + (c.chassis === r.best_chassis ? " best" : ""));
    d.append(el("div", "", `${c.percent}٪ — ${RULES[c.rule] || c.rule}`));
    const s = el("small", "", "شاسی: "); s.append(el("b", "ltr", c.chassis)); d.append(s);
    c.notes.forEach(n => d.append(el("small", "", n)));
    if (c.counted_policies.length) d.append(el("small", "", "بیمه‌نامه‌های شمرده‌شده: " + c.counted_policies.join("، ")));
    cars.append(d);
  });
  if (!r.cars.length) cars.append(el("div", "warn", "استعلامی یافت نشد؛ در ورود اطلاعات دقت کنید."));
  body.append(cars);

  const bar = el("div", "details-bar");
  const toggle = el("button", "details-toggle"); toggle.type = "button";
  const label = el("span", "", "نمایش جزئیات"), arrow = el("span", "arrow", "▾");
  toggle.append(label, arrow); toggle.setAttribute("aria-expanded", "false");
  toggle.onclick = () => {
    const open = body.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
    label.textContent = open ? "بستن جزئیات" : "نمایش جزئیات";
  };
  bar.append(toggle);
  out.append(bar, body);
}

// لودینگ تمام‌صفحه (شمارنده دارد تا مرحله‌ی خواندن فایل و مرحله‌ی استعلام که پشت‌سرهم می‌آیند، وسطش چشمک نزنند)
let loadingDepth = 0;
function showLoading(text, sub) {
  loadingDepth++;
  $("loadingText").textContent = text || "در حال پردازش…";
  $("loadingSub").textContent = sub || "";
  $("loading").classList.add("show");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function hideLoading() {
  loadingDepth = Math.max(0, loadingDepth - 1);
  if (!loadingDepth) $("loading").classList.remove("show");
}

// ===== خواندن اسکرین‌شات صفحه‌ی استعلام (منطق خالص، بدون وابستگی به مرورگر) =====
// words: [{t, c, x0, y0, x1, y1}] ← خروجی چند بار OCR ارقام (مختصات بر حسب پیکسل عکس اصلی)

function shotCheckNationalCode(c) {
  if (!/^\d{10}$/.test(c) || /^(\d)\1{9}$/.test(c)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += Number(c[i]) * (10 - i);
  const r = s % 11;
  return Number(c[9]) === (r < 2 ? r : 11 - r);
}

// چند بار OCR یک کادر را می‌بیند؛ کلمه‌های هم‌مکان یک خوشه می‌شوند و مقدار با بیشترین «اطمینان جمع‌شده» می‌ماند
function shotCluster(words) {
  const clusters = [];
  for (const w of words) {
    const cx = (w.x0 + w.x1) / 2, cy = (w.y0 + w.y1) / 2;
    let hit = clusters.find(k => cx > k.x0 - 6 && cx < k.x1 + 6 && cy > k.y0 - 6 && cy < k.y1 + 6);
    if (!hit) { hit = { x0: w.x0, y0: w.y0, x1: w.x1, y1: w.y1, votes: {} }; clusters.push(hit); }
    hit.x0 = Math.min(hit.x0, w.x0); hit.y0 = Math.min(hit.y0, w.y0);
    hit.x1 = Math.max(hit.x1, w.x1); hit.y1 = Math.max(hit.y1, w.y1);
    const v = hit.votes[w.t] || (hit.votes[w.t] = { sum: 0, n: 0 });
    v.sum += w.c; v.n++;
  }
  return clusters.map(k => {
    const best = Object.entries(k.votes).sort((a, b) => b[1].sum - a[1].sum || b[1].n - a[1].n)[0];
    return { t: best[0], c: best[1].sum / best[1].n, n: best[1].n, x0: k.x0, y0: k.y0, x1: k.x1, y1: k.y1,
             cx: (k.x0 + k.x1) / 2, cy: (k.y0 + k.y1) / 2, h: k.y1 - k.y0 };
  });
}

function parseScreenshotWords(rawWords, W, H) {
  const out = { national_code: null, trace_code: null, plate: null, missing: [], limitY: H, plateY: null };
  const words = rawWords
    .map(w => Object.assign({}, w, { t: String(w.t).replace(/[^0-9\/]/g, "") }))
    .filter(w => w.t && w.c >= 55);
  const cl = shotCluster(words);

  // ابتدای جدول خودروها: اولین تاریخ (۱۳۹۸/۰۹/۲۸)؛ هرچه بالاتر از آن است بخش فرم است
  const dates = cl.filter(k => /^1[34]\d\d\/\d\d\/\d\d$/.test(k.t));
  const hs = cl.map(k => k.h).sort((a, b) => a - b);
  const medH = hs.length ? hs[Math.floor(hs.length / 2)] : 14;
  const limit = dates.length ? Math.min(...dates.map(k => k.y0)) - 3 * medH : H * 0.5;
  out.limitY = limit;
  const form = cl.filter(k => k.cy < limit && !k.t.includes("/"));

  const pick = list => list.sort((a, b) => b.c - a.c || b.n - a.n)[0] || null;
  const nc = pick(form.filter(k => k.t.length === 10));
  const tc = pick(form.filter(k => k.t.length >= 11 && k.t.length <= 20));
  out.national_code = nc ? nc.t : null;
  out.trace_code = tc ? tc.t : null;
  const codesY = [nc, tc].filter(Boolean).map(k => k.cy);

  // ردیف پلاک: عددهای ۲ و ۳ رقمی هم‌ردیف؛ نزدیک‌ترین ردیف بالای ردیف کدها
  const small = form.filter(k => k.t.length === 2 || k.t.length === 3);
  const rows = [];
  for (const k of small.sort((a, b) => a.cy - b.cy)) {
    const r = rows.find(r => Math.abs(r.cy - k.cy) < Math.max(8, medH * 0.8));
    if (r) { r.items.push(k); r.cy = r.items.reduce((s, x) => s + x.cy, 0) / r.items.length; }
    else rows.push({ cy: k.cy, items: [k] });
  }
  const above = codesY.length ? rows.filter(r => r.cy < Math.min(...codesY) - 2) : rows;
  const scored = above.map(r => ({ r, s: r.items.some(i => i.t.length === 3) * 2 + r.items.length }));
  scored.sort((a, b) => b.s - a.s || b.r.cy - a.r.cy);
  const row = scored.length && scored[0].s >= 3 ? scored[0].r : null;
  if (row) {
    const it = row.items.sort((a, b) => a.cx - b.cx);   // چپ ← راست روی صفحه
    const three = it.find(i => i.t.length === 3);
    let left2 = null, right3 = null, serial = null;
    if (three) {
      right3 = three.t;
      const l = it.filter(i => i.t.length === 2 && i.cx < three.cx);
      const r = it.filter(i => i.t.length === 2 && i.cx > three.cx);
      left2 = l.length ? l[l.length - 1].t : null;   // نزدیک‌ترین به سه‌رقمی (حرف بین آن‌هاست)
      serial = r.length ? r[0].t : null;
    }
    out.plate = { serial, right3, letter: "", left2 };
    out.plateY = row.cy;
  }

  if (!out.national_code) out.missing.push("کد ملی");
  if (!out.trace_code) out.missing.push("کد رهگیری");
  if (!out.plate || !out.plate.serial || !out.plate.right3 || !out.plate.left2) out.missing.push("پلاک");
  if (out.national_code && !shotCheckNationalCode(out.national_code))
    out.warning = "کد ملی خوانده‌شده معتبر نیست (رقم کنترل نمی‌خورد)؛ با عکس تطبیق بده.";
  return out;
}

// ===== پیدا کردن کادر فیروزه‌ای حرف پلاک و خود حرف روی عکس =====
function shotLabel(mask, w, h) {
  const lab = new Int32Array(w * h), comps = [];
  const stack = [];
  for (let i = 0; i < w * h; i++) {
    if (!mask[i] || lab[i]) continue;
    const id = comps.length + 1;
    const c = { id, area: 0, x0: w, y0: h, x1: 0, y1: 0 };
    lab[i] = id; stack.push(i);
    while (stack.length) {
      const p = stack.pop(), x = p % w, y = (p - x) / w;
      c.area++; if (x < c.x0) c.x0 = x; if (x > c.x1) c.x1 = x; if (y < c.y0) c.y0 = y; if (y > c.y1) c.y1 = y;
      if (x > 0 && mask[p - 1] && !lab[p - 1]) { lab[p - 1] = id; stack.push(p - 1); }
      if (x < w - 1 && mask[p + 1] && !lab[p + 1]) { lab[p + 1] = id; stack.push(p + 1); }
      if (y > 0 && mask[p - w] && !lab[p - w]) { lab[p - w] = id; stack.push(p - w); }
      if (y < h - 1 && mask[p + w] && !lab[p + w]) { lab[p + w] = id; stack.push(p + w); }
    }
    comps.push(c);
  }
  return { lab, comps };
}

// data: Uint8ClampedArray RGBA. خروجی: {box, glyph:{x0,y0,x1,y1}, mask} یا null
function findLetterGlyph(data, w, h, limitY, plateY) {
  const teal = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
    teal[i] = (r < 90 && g > 140 && b > 120 && g - r > 80 && Math.abs(g - b) < 70) ? 1 : 0;
  }
  const { comps } = shotLabel(teal, w, h);
  let cands = comps.filter(c => {
    const cw = c.x1 - c.x0 + 1, ch = c.y1 - c.y0 + 1;
    return c.area > 150 && cw / ch > 1.3 && cw / ch < 5 && c.y1 < limitY;
  });
  if (!cands.length) return null;
  if (plateY != null) cands.sort((a, b) => Math.abs((a.y0 + a.y1) / 2 - plateY) - Math.abs((b.y0 + b.y1) / 2 - plateY));
  const box = cands[0];
  const m = 3;                                   // حاشیه‌ی گوشه‌های گرد را کنار می‌گذاریم
  const x0 = box.x0 + m, x1 = box.x1 - m, y0 = box.y0 + m, y1 = box.y1 - m;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const white = new Uint8Array(bw * bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const p = ((y0 + y) * w + (x0 + x)) * 4;
    white[y * bw + x] = Math.min(data[p], data[p + 1], data[p + 2]) > 185 ? 1 : 0;
  }
  const { comps: gc } = shotLabel(white, bw, bh);
  let parts = gc.filter(c => c.area >= 2);
  // فلش ▼ لیست کشویی: پهن‌تر از بلند و در سمت چپ کادر
  parts = parts.filter(c => !((c.x1 - c.x0 + 1) > (c.y1 - c.y0 + 1) * 1.05 && (c.x0 + c.x1) / 2 < bw * 0.45));
  if (!parts.length) return null;
  const g = { x0: Math.min(...parts.map(c => c.x0)), y0: Math.min(...parts.map(c => c.y0)),
              x1: Math.max(...parts.map(c => c.x1)), y1: Math.max(...parts.map(c => c.y1)) };
  return { box: { x0: box.x0, y0: box.y0, x1: box.x1, y1: box.y1 },
           glyph: { x0: g.x0 + x0, y0: g.y0 + y0, x1: g.x1 + x0, y1: g.y1 + y0 },
           mask: white, mw: bw, mh: bh, ox: x0, oy: y0 };
}

// ===== بخش مرورگر: OCR با tesseract.js (بدون نصب روی سیستم) =====
let _tessPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (_tessPromise) return _tessPromise;
  _tessPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res;
    s.onerror = () => { _tessPromise = null; rej(new Error("بارگذاری موتور خواندن عکس ممکن نشد (اینترنت یا فیلتر)")); };
    document.head.appendChild(s);
  });
  return _tessPromise;
}

// حرف پلاک فقط یک نقش ۹×۱۲ پیکسلی است؛ بزرگش می‌کنیم و با مدل فارسی می‌خوانیم. اگر مطمئن نشد، خالی برمی‌گرداند.
async function readPlateLetter(ctx, W, H, res) {
  const g = findLetterGlyph(ctx.getImageData(0, 0, W, H).data, W, H, res.limitY, res.plateY);
  if (!g) return "";
  const gw = g.glyph.x1 - g.glyph.x0 + 1, gh = g.glyph.y1 - g.glyph.y0 + 1;
  const small = document.createElement("canvas"); small.width = gw; small.height = gh;
  const sctx = small.getContext("2d"), im = sctx.createImageData(gw, gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const on = g.mask[(g.glyph.y0 + y - g.oy) * g.mw + (g.glyph.x0 + x - g.ox)];
    const p = (y * gw + x) * 4, v = on ? 0 : 255;
    im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255;
  }
  sctx.putImageData(im, 0, 0);
  const K = 12, pad = 6 * K, big = document.createElement("canvas");
  big.width = gw * K + 2 * pad; big.height = gh * K + 2 * pad;
  const bctx = big.getContext("2d");
  bctx.fillStyle = "#fff"; bctx.fillRect(0, 0, big.width, big.height);
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = "high";
  bctx.drawImage(small, pad, pad, gw * K, gh * K);
  const w = await Tesseract.createWorker("fas");
  try {
    await w.setParameters({ tessedit_pageseg_mode: "10" });
    const { data } = await w.recognize(big);
    const raw = (data.text || "").replace(/\s+/g, "");
    const ch = PERSIAN_FIX[raw] || raw;
    const ok = [...$("lt").options].some(o => o.value === ch);
    return ok && data.confidence >= 45 ? ch : "";
  } finally { await w.terminate(); }
}

// اسکرین‌شات صفحه‌ی استعلام (یا هر عکس از آن) ← کد ملی، کد رهگیری، پلاک
async function readScreenshot(file) {
  await loadTesseract();
  const bmp = await createImageBitmap(file);
  const W = bmp.width, H = bmp.height;
  const c1 = document.createElement("canvas"); c1.width = W; c1.height = H;
  const ctx = c1.getContext("2d", { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0);
  const scale = Math.min(2, Math.max(0.5, 2800 / W));
  const c2 = document.createElement("canvas"); c2.width = Math.round(W * scale); c2.height = Math.round(H * scale);
  const c2x = c2.getContext("2d"); c2x.imageSmoothingQuality = "high"; c2x.drawImage(bmp, 0, 0, c2.width, c2.height);
  const words = [];
  const worker = await Tesseract.createWorker("eng");
  try {
    for (const psm of ["6", "11"]) {   // دو حالت صفحه‌بندی؛ هرکدام چیزی را که دیگری از دست می‌دهد می‌گیرد
      await worker.setParameters({ tessedit_char_whitelist: "0123456789/", tessedit_pageseg_mode: psm });
      const { data } = await worker.recognize(c2);
      for (const w of data.words || [])
        words.push({ t: w.text, c: w.confidence, x0: w.bbox.x0 / scale, y0: w.bbox.y0 / scale, x1: w.bbox.x1 / scale, y1: w.bbox.y1 / scale });
    }
  } finally { await worker.terminate(); }
  const res = parseScreenshotWords(words, W, H);
  res.source = "screenshot";
  if (res.plate) {
    try { res.plate.letter = await readPlateLetter(ctx, W, H, res); } catch (e) { res.plate.letter = ""; }
    if (!res.plate.letter) res.missing.push("حرف پلاک");
  }
  return res;
}

// ===== خواندن اسکرین‌شات «برگه‌ی استعلام تاریخچه پلاک» (فرم بالای برگه): هر تکه جدا برش و خوانده می‌شود =====
// خواندن کل عکس با هم، برچسب‌های فارسی کنار کدها را رقم می‌خواند و به کد می‌چسباند؛ پس ردیف فرم را پیدا و تکه‌تکه می‌خوانیم.
function sheetFindBand(dark, W, H) {
  const ys = [];
  for (let y = 0; y < H; y++) { let n = 0; for (let x = 0; x < W; x++) n += dark[y * W + x]; if (n > W * 0.5) ys.push(y); }
  const lines = [];   // خط‌های ضخیم چندردیفی یکی می‌شوند
  for (const y of ys) { const l = lines[lines.length - 1]; if (l && y - l.y1 <= 2) l.y1 = y; else lines.push({ y0: y, y1: y }); }
  for (let i = 0; i + 1 < lines.length; i++) {
    const gap = lines[i + 1].y0 - lines[i].y1;
    if (gap > W * 0.025 && gap < W * 0.09) return { y0: lines[i].y1 + 3, y1: lines[i + 1].y0 - 3 };
  }
  return null;
}
function sheetVRun(dark, W, x, y0, y1) {   // بلندترین رشته‌ی پیوسته‌ی تیره در یک ستون (لبه‌ی کادر)
  let m = 0, b = 0;
  for (let y = y0; y <= y1; y++) { if (dark[y * W + x]) { b++; if (b > m) m = b; } else b = 0; }
  return m;
}
function sheetTokens(dark, W, y0, y1, minGap) {
  const cols = new Uint8Array(W);
  for (let x = 0; x < W; x++) for (let y = y0; y <= y1; y++) if (dark[y * W + x]) { cols[x] = 1; break; }
  const toks = []; let x = 0;
  while (x < W) {
    if (!cols[x]) { x++; continue; }
    const s = x; let gap = 0, e = x;
    while (x < W && gap < minGap) { if (cols[x]) { gap = 0; e = x; } else gap++; x++; }
    if (e - s >= 3) toks.push({ x0: s, x1: e });
  }
  return toks;
}
function sheetCrop(src, x0, y0, x1, y1, scaleTo) {
  const w = x1 - x0 + 1, h = y1 - y0 + 1, k = Math.max(1, scaleTo / h);
  const c = document.createElement("canvas"); c.width = Math.round(w * k) + 40; c.height = Math.round(h * k) + 40;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = "high"; x.drawImage(src, x0, y0, w, h, 20, 20, Math.round(w * k), Math.round(h * k));
  return c;
}
async function readSheetForm(file) {
  await loadTesseract();
  const bmp = await createImageBitmap(file), W = bmp.width, H = bmp.height;
  const c1 = document.createElement("canvas"); c1.width = W; c1.height = H;
  const ctx = c1.getContext("2d", { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data, dark = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) dark[i] = Math.min(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]) < 140 ? 1 : 0;
  const band = sheetFindBand(dark, W, H);
  if (!band) return null;
  const { y0, y1 } = band, bh = y1 - y0 + 1;
  const toks = sheetTokens(dark, W, y0, y1, Math.max(10, Math.round(W * 0.014)));
  const worker = await Tesseract.createWorker("eng");
  const out = { national_code: null, trace_code: null, plate: null, missing: [], source: "screenshot" };
  const digits = async (x0, x1, yy0, yy1) => {
    const { data } = await worker.recognize(sheetCrop(c1, x0, yy0, x1, yy1, 120));
    return (data.text || "").replace(/[^0-9]/g, "");
  };
  try {
    await worker.setParameters({ tessedit_char_whitelist: "0123456789", tessedit_pageseg_mode: "7" });
    const longs = [];
    let plateTok = null;
    for (const t of toks) {
      const w = t.x1 - t.x0 + 1;
      // گروه کادرهای پلاک: پهن‌ترین تکه که ستون‌های عمودی (لبه‌ی کادرها) دارد
      let vlines = 0;
      for (let x = t.x0; x <= t.x1; x++) if (sheetVRun(dark, W, x, y0, y1) >= bh * 0.55) vlines++;
      if (vlines >= 4 && (!plateTok || w > plateTok.x1 - plateTok.x0)) { plateTok = t; continue; }
      if (w > W * 0.04) {
        const v = await digits(t.x0, t.x1, y0, y1);
        if (v.length >= 10 && v.length <= 20) longs.push({ v, x: t.x0 });
      }
    }
    longs.sort((a, b) => a.x - b.x);
    const nc = longs.find(l => l.v.length === 10 && shotCheckNationalCode(l.v)) || longs.find(l => l.v.length === 10);
    const tc = longs.find(l => l.v.length >= 11);
    out.national_code = nc ? nc.v : null;
    out.trace_code = tc ? tc.v : null;
    if (plateTok) {
      // لبه‌های کادرها: ستون‌های پشت‌سرهم یک لبه حساب می‌شوند
      const edges = []; let last = -9;
      for (let x = plateTok.x0; x <= plateTok.x1; x++) {
        if (sheetVRun(dark, W, x, y0, y1) >= bh * 0.55) { if (x - last > 3) edges.push({ a: x, b: x }); else edges[edges.length - 1].b = x; last = x; }
      }
      if (edges.length && edges[0].a - plateTok.x0 > 8) edges.unshift({ a: plateTok.x0, b: plateTok.x0 });   // لبه‌ی چپ کادر اول کم‌رنگ است
      const boxes = [];
      for (let i = 0; i + 1 < edges.length; i++)
        if (edges[i + 1].a - edges[i].b > 8) boxes.push({ x0: edges[i].b + 2, x1: edges[i + 1].a - 2 });
      // چپ ← راست: [۲ رقم] [حرف] [۳ رقم] [ایران + سریال]
      if (boxes.length >= 4) {
        const b = boxes.slice(-4), m = Math.round(bh * 0.22), iy0 = y0 + m, iy1 = y1 - m;   // داخل کادر، بدون خط لبه
        const inner = k => [k.x0 + 2, k.x1 - 2];
        const left2 = await digits(...inner(b[0]), iy0, iy1);
        const right3 = await digits(...inner(b[2]), iy0, iy1);
        // کادر ایران: «ایران» (رقم خوانده نمی‌شود) و سریال دو رقمی در سمت راست کادر
        const serial = (await digits(...inner(b[3]), iy0, iy1)).slice(-2);
        let letter = "";
        try { letter = await sheetReadLetter(c1, b[1], iy0, iy1); } catch (e) { letter = ""; }
        out.plate = { left2, right3, serial, letter };
      }
    }
  } finally { await worker.terminate(); }
  if (out.plate && (out.plate.left2.length !== 2 || out.plate.right3.length !== 3 || out.plate.serial.length !== 2)) out.plate = null;
  if (!out.national_code) out.missing.push("کد ملی");
  if (!out.trace_code) out.missing.push("کد رهگیری");
  if (!out.plate) out.missing.push("پلاک");
  else if (!out.plate.letter) out.missing.push("حرف پلاک");
  if (out.national_code && !shotCheckNationalCode(out.national_code))
    out.warning = "کد ملی خوانده‌شده معتبر نیست (رقم کنترل نمی‌خورد)؛ با عکس تطبیق بده.";
  return (out.national_code || out.trace_code || out.plate) ? out : null;
}
async function sheetReadLetter(src, box, y0, y1) {
  const w = await Tesseract.createWorker("fas");
  try {
    await w.setParameters({ tessedit_pageseg_mode: "10" });
    for (const sz of [160, 120]) {   // در دو اندازه امتحان؛ اولین حرفی که در فهرست حروف پلاک باشد
      const { data } = await w.recognize(sheetCrop(src, box.x0 + 3, y0, box.x1 - 3, y1, sz));
      const raw = (data.text || "").replace(/\s+/g, "");
      const ch = PERSIAN_FIX[raw] || raw;
      if ([...$("lt").options].some(o => o.value === ch)) return ch;
    }
    return "";
  } finally { await w.terminate(); }
}

// بارگذاری برگه‌ی تاریخچه (PDF) یا اسکرین‌شات ← پر شدن خودکار کد ملی، کد رهگیری و پلاک
async function handleHistoryFile(file) {
  if (!file) return;
  const isImg = (file.type || "").startsWith("image/");
  const btn = $("uploadBtn"), st = $("status");
  btn.disabled = true;
  st.replaceChildren();
  $("lt").classList.remove("need");
  showLoading(isImg ? "در حال خواندن اسکرین‌شات…" : "در حال خواندن فایل تاریخچه…",
              isImg ? "بار اول چند ثانیه برای آماده شدن موتور خواندن طول می‌کشد" : "");
  try {
    let d = null, clientErr = null;
    if (isImg) {
      try {   // اول خواندن تکه‌تکه‌ی فرم برگه؛ اگر ردیف فرم پیدا نشد، روش قبلی (اسکرین‌شات صفحه‌ی وب)
        d = await readSheetForm(file);
        if (!d || !(d.trace_code && d.plate)) {
          const d2 = await readScreenshot(file);
          if (d2 && (d2.plate || d2.trace_code || d2.national_code) && (!d || (d2.missing || []).length < (d.missing || []).length)) d = d2;
        }
        if (d && !d.plate && !d.trace_code && !d.national_code) d = null;
      } catch (e) { clientErr = e; d = null; }
    }
    if (!d) {   // PDF، یا عکسی که در مرورگر خوانده نشد ← خواندن سمت سرور (اگر Tesseract آنجا نصب باشد)
      try {
        const res = await fetch(API_BASE + "/api/extract", {
          method: "POST", headers: authHeaders({"Content-Type": file.type || "application/octet-stream"}), body: file
        });
        d = await res.json();
        if (!res.ok) throw new Error(d.error || "خطای نامشخص");
      } catch (e) {
        if (clientErr) throw new Error("خواندن اسکرین‌شات ممکن نشد: " + clientErr.message);
        throw e;
      }
    }
    if (d.national_code) $("nc").value = d.national_code;
    if (d.trace_code) $("tc").value = d.trace_code;
    if (d.plate) {
      if (d.plate.serial) $("sr").value = d.plate.serial;
      if (d.plate.right3) $("r3").value = d.plate.right3;
      if (d.plate.left2) $("l2").value = d.plate.left2;
      if (d.plate.letter && [...$("lt").options].some(o => o.value === d.plate.letter)) $("lt").value = d.plate.letter;
    }
    st.replaceChildren();
    const notes = [];
    if (d.missing && d.missing.length) notes.push("این موارد از فایل خوانده نشد، دستی وارد کن: " + d.missing.join("، "));
    if (d.warning) notes.push(d.warning);
    if (d.source === "ocr") notes.push("فایل عکس بود و با OCR خوانده شد؛ مقدارها را با عکس تطبیق بده.");
    if (notes.length) st.append(el("div", "status error", notes.join(" — ")));
    const letterMissing = !!(d.missing && d.missing.includes("حرف پلاک"));
    if (letterMissing) $("lt").classList.add("need");   // لیست حرف همان «ب» پیش‌فرض را نشان می‌دهد؛ نباید ندیده گرفته شود
    // اگر همه‌ی فیلدها از فایل پر شدند، استعلام خودکار انجام شود (برای عکس/اسکرین‌شات نه؛ اول باید با عکس تطبیق داده شود)
    const allFilled = ["nc", "tc", "sr", "r3", "l2", "lt"].every(id => String($(id).value || "").trim());
    if (!notes.length && allFilled && d.source !== "screenshot") {
      await runAnalysis();   // لودینگ همچنان روی صفحه می‌ماند تا نتیجه آماده شود
      return;
    }
    if (!notes.length) st.append(el("div", "status", d.source === "screenshot"
      ? "از اسکرین‌شات خوانده شد؛ حرف پلاک و عددها را یک‌بار با عکس تطبیق بده و «استعلام و محاسبه» را بزن."
      : "کد ملی، کد رهگیری و پلاک از فایل خوانده شد؛ روی «استعلام و محاسبه» بزن."));
    if (letterMissing) $("lt").focus(); else focusNextEmpty();
  } catch (e) {
    st.replaceChildren(el("div", "status error", e.message === "Failed to fetch"
      ? "اتصال به سرور برقرار نشد؛ مطمئن شوید برنامه روی سیستم میزبان اجراست." : e.message));
  } finally {
    btn.disabled = false;
    hideLoading();
  }
}
$("uploadBtn").onclick = () => $("historyFile").click();
$("historyFile").onchange = ev => { const f = ev.target.files[0]; ev.target.value = ""; handleHistoryFile(f); };
$("lt").addEventListener("change", () => $("lt").classList.remove("need"));

// اسکرین‌شات را می‌شود مستقیم Paste کرد (Ctrl+V) یا روی صفحه انداخت (Drag & Drop)
document.addEventListener("paste", e => {
  const cd = e.clipboardData; if (!cd) return;
  const f = [...(cd.files || [])].find(x => x.type.startsWith("image/"))
         || [...(cd.items || [])].map(i => (i.kind === "file" ? i.getAsFile() : null)).find(x => x && x.type.startsWith("image/"));
  if (!f) return;            // متن معمولی را دست نمی‌زنیم
  e.preventDefault();
  handleHistoryFile(f);
});
document.addEventListener("dragover", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  e.preventDefault();
  handleHistoryFile(f);
});


let analysisBusy = false;
async function runAnalysis() {
  if (analysisBusy) return;
  analysisBusy = true;
  const btn = $("go"), out = $("out"), st = $("status");
  btn.disabled = true; btn.textContent = "در حال استعلام…"; out.replaceChildren();
  st.replaceChildren();
  showLoading("در حال استعلام از بیمه مرکزی…", "ممکن است چند ثانیه طول بکشد");
  try {
    const res = await fetch(API_BASE + "/api/analyze", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({national_code: $("nc").value, trace_code: $("tc").value,
        left2: $("l2").value, letter: $("lt").value, right3: $("r3").value, serial: $("sr").value})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "خطای نامشخص");
    st.replaceChildren();
    $("printTitle").textContent = `تاریخچه‌خوانی — پلاک: ${$("sr").value} - ${$("r3").value} ${$("lt").value} ${$("l2").value} — تاریخ چاپ: ${new Date().toLocaleDateString("fa-IR")}`;
    show(data);
  } catch (e) {
    const msg = e instanceof TypeError ? "اتصال به سرور برقرار نشد؛ مطمئن شوید برنامه روی سیستم میزبان اجراست." : e.message;
    st.replaceChildren(el("div", "status error", "خطا: " + msg));
    checkServer();
  } finally {
    btn.disabled = false; btn.textContent = "استعلام و محاسبه";
    analysisBusy = false;
    hideLoading();
  }
}
$("go").onclick = () => runAnalysis();
$("themeToggleBtn").onclick = () => {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("tarikhcheTheme", next); } catch (e) {}
};

checkServer();
