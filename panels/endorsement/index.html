<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحاقیه ایران</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/img-89d70a41.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/img-59d045c2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#294d86;
    --navy-dark:#203f70;
    --navy-soft:#365d99;
    --navy-pale:#eef4fc;
    --bg:#ffffff;
    --card:#ffffff;
    --border:#e4eaf3;
    --text:#213b63;
    --muted:#77849a;
    --danger:#d95b61;
    --danger-bg:#fff0f1;
    --success:#259568;
    --success-bg:#ebf8f1;
    --warn:#8a6d1a;
    --warn-bg:#fff8e5;
  }

  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{
    font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
    direction:rtl;
    color:var(--text);
    background:#fff;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 88% 12%,rgba(41,77,134,.035),transparent 28%),
      radial-gradient(circle at 12% 80%,rgba(41,77,134,.025),transparent 30%);
  }

  .hidden{display:none!important}

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 90px;
  }
  .page-header{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    min-height:118px;
    padding:22px 30px;
    margin-bottom:28px;
    border-radius:22px;
    color:#fff;
    background:linear-gradient(135deg,#294d86 0%,#315a98 100%);
    box-shadow:0 16px 35px -22px rgba(32,63,112,.55);
  }

  .page-header::before{
    content:"";
    position:absolute;
    width:260px;height:260px;
    left:-110px;top:-175px;
    border-radius:50%;
    background:rgba(255,255,255,.055);
  }

  .page-header-text{
    display:flex;
    align-items:center;
    gap:15px;
    position:relative;
    z-index:1;
  }

  .page-header-badge{
    width:58px;height:58px;
    flex:0 0 58px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.12);
  }

  .page-header h1{
    margin:0 0 5px;
    font-size:22px;
    font-weight:800;
    letter-spacing:-.3px;
    color:#fff;
  }

  .page-header p{
    margin:0;
    font-size:12px;
    color:rgba(255,255,255,.78);
  }

  .user-box{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }

  .user-role-pill{
    padding:7px 14px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    background:#fff;
    color:var(--navy);
  }

  .user-email{
    font-size:11.5px;
    color:rgba(255,255,255,.88);
    direction:ltr;
  }

  .logout-btn{
    padding:7px 14px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    font-family:inherit;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:#fff;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap;
  }
  .logout-btn:hover{
    background:rgba(255,255,255,.22);
    border-color:rgba(255,255,255,.55);
  }
  .auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:#fff;
  }

  .auth-card{
    width:100%;
    max-width:390px;
    padding:34px 30px 28px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:0 18px 45px -25px rgba(35,62,100,.28);
  }

  .auth-badge{
    width:60px;height:60px;
    margin:0 auto 16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:#e7effb;
    color:var(--navy);
  }

  .auth-card h1{
    margin:0 0 6px;
    text-align:center;
    font-size:19px;
    font-weight:800;
    color:var(--text);
  }

  .auth-card p{
    margin:0 0 24px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
  }

  .auth-field{margin-bottom:14px}
  .auth-field label{
    display:block;
    margin-bottom:7px;
    color:var(--text);
    font-size:11.5px;
    font-weight:600;
  }

  .auth-field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    background:#fff;
    color:var(--text);
    font:13px 'Vazirmatn',Tahoma,sans-serif;
    direction:ltr;
    text-align:left;
    transition:.2s;
  }

  .auth-field input:focus,
  input[type=text]:focus{
    border-color:#7c9dcc;
    box-shadow:0 0 0 3px rgba(41,77,134,.09);
  }

  .auth-submit,
  button.primary{
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,var(--navy),var(--navy-soft));
    color:#fff;
    font:600 13px 'Vazirmatn',Tahoma,sans-serif;
    cursor:pointer;
    transition:.2s;
  }

  .auth-submit{
    width:100%;
    margin-top:7px;
    padding:12px;
  }

  .auth-submit:hover:not(:disabled),
  button.primary:hover:not(:disabled){
    background:linear-gradient(135deg,var(--navy-dark),var(--navy));
    transform:translateY(-1px);
    box-shadow:0 8px 18px -12px rgba(32,63,112,.7);
  }

  .auth-submit:disabled,
  button.primary:disabled{opacity:.55;cursor:not-allowed}

  .auth-status{
    display:none;
    margin-top:13px;
    text-align:center;
    font-size:12px;
  }
  .auth-status.show{display:block}
  .auth-status.error{color:var(--danger)}
  .auth-status.info{color:var(--navy)}
  .cards{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .panel-card{
    position:relative;
    overflow:hidden;
    padding:25px 27px 23px;
    background:rgba(255,255,255,.98);
    border:1px solid var(--border);
    border-radius:19px;
    box-shadow:0 12px 30px -24px rgba(35,62,100,.38);
  }

  .panel-card::before{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:4px;
    background:linear-gradient(#294d86,#5578ad);
    opacity:.9;
  }

  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }

  .card-num{
    width:28px;height:28px;
    flex:0 0 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--navy-pale);
    color:var(--navy);
    font-size:12px;
    font-weight:800;
  }

  .panel-title{
    margin:0;
    font-size:16px;
    font-weight:800;
    color:var(--text);
  }

  .panel-sub{
    margin:5px 0 18px 38px;
    color:var(--muted);
    font-size:12px;
    line-height:1.9;
  }

  .field-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    min-width:180px;
  }

  .field label{
    color:var(--text);
    font-size:11.5px;
    font-weight:600;
  }

  input[type=text]{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:#fff;
    color:var(--text);
    font:13px 'Vazirmatn',Tahoma,sans-serif;
    direction:ltr;
    text-align:right;
    transition:.2s;
  }

  .form-actions{
    display:flex;
    justify-content:flex-start;
    margin-top:15px;
  }

  button.primary{
    padding:10px 20px;
    white-space:nowrap;
  }

  .notice{
    margin-top:15px;
    padding:10px 13px;
    border-radius:10px;
    background:var(--warn-bg);
    color:var(--warn);
    font-size:11.5px;
    line-height:1.9;
  }

  .status{
    display:none;
    margin-top:13px;
    padding:9px 12px;
    border-radius:9px;
    font-size:12px;
  }
  .status.show{display:block}
  .status.error{background:var(--danger-bg);color:var(--danger)}
  .status.info{background:#eef3fb;color:var(--navy)}
  .status.success{background:var(--success-bg);color:var(--success)}
  .status.empty{background:var(--warn-bg);color:var(--warn)}
  .file-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-top:15px;
  }

  .file-item{
    overflow:hidden;
    background:#fbfcfe;
    border:1px solid var(--border);
    border-radius:11px;
  }

  .file-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
    padding:11px 13px;
  }

  .file-meta{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }

  .file-icon{
    width:34px;height:34px;
    flex:0 0 34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:var(--navy-pale);
    color:var(--navy);
    font-size:10px;
    font-weight:800;
  }

  .file-name{
    font-size:12px;
    word-break:break-all;
    color:var(--text);
  }

  .file-actions{display:flex;gap:7px}
  .btn-sm{
    padding:7px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font:11px 'Vazirmatn',Tahoma,sans-serif;
    cursor:pointer;
  }
  .btn-sm.view{
    color:var(--navy);
    border-color:#cbd9ec;
  }
  .btn-sm:hover{background:#f4f7fb}

  .file-preview{
    display:none;
    border-top:1px solid var(--border);
    background:#fff;
  }
  .file-preview.open{display:block}
  .file-preview iframe{
    display:block;
    width:100%;
    height:520px;
    border:0;
  }

  .spinner{
    display:inline-block;
    width:14px;height:14px;
    margin-right:6px;
    vertical-align:middle;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .site-footer{
    margin-top:28px;
    text-align:center;
    color:#a2adbc;
    font-size:10.5px;
  }

  @media (max-width:720px){
    .page{padding:18px 14px 80px}
    .page-header{
      min-height:auto;
      padding:18px;
      flex-direction:column;
      align-items:stretch;
    }
    .user-box{justify-content:flex-start}
    .user-email{display:none}
    .panel-card{padding:20px 18px}
    .panel-sub{margin-right:0;margin-left:0}
  }
</style>
<script>if(window.top!==window.self)document.documentElement.classList.add('embedded')</script>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("tarikhcheTheme")==="dark"?"dark":"light")}catch(e){}</script>
<link rel="stylesheet" href="../theme.css">
</head>
<body>

<div id="page" class="page hidden">

  <div class="page-header">
    <div class="page-header-text">
      <div class="page-header-badge">📄</div>
      <div>
        <h1>الحاقیه ایران</h1>
        <p>دریافت و صدور الحاقیه‌ </p>
      </div>
    </div>
    <div class="user-box">
      <span class="user-email" id="userEmailLabel"></span>
      <span class="user-role-pill" id="userRolePill">—</span>
    </div>
  </div>

  <div class="cards">

    
    <div class="panel-card">
      <div class="card-head">
        <span class="card-num">۱</span>
        <h2 class="panel-title">دریافت الحاقیه</h2>
      </div>
      <p class="panel-sub">شماره بیمه‌نامه رو وارد کنید تا الحاقیه‌های صادرشده روش نمایش داده بشه.</p>

      <div class="field-row">
        <div class="field" style="flex:2;">
          <label for="policyInput">شماره بیمه‌نامه</label>
          <input type="text" id="policyInput" placeholder="مثال: 1403/01/12/03456" />
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" id="searchBtn">دریافت الحاقیه</button>
      </div>

      <div id="status" class="status"></div>
      <div id="fileList" class="file-list"></div>
    </div>

    
  </div>

  <div class="site-footer">developed by M.gh</div>
</div>

<script src="../../config.js"></script>
<script>
const API_BASE = ((window.APP_CONFIG&&window.APP_CONFIG.API_BASE)||'').replace(/\/+$/,'') + '/endorsement';
const AUTH_BASE = ((window.APP_CONFIG&&window.APP_CONFIG.API_BASE)||'').replace(/\/+$/,'') + '/auth';   // سرویس لاگین مستقل
const TOKEN_STORAGE_KEY = 'panel-auth-token';

const pageEl = document.getElementById('page');
const userEmailLabel = document.getElementById('userEmailLabel');
const userRolePill = document.getElementById('userRolePill');

// این پنل لاگین ندارد؛ توکنی را که داشبورد (لاگین مستقل) ذخیره کرده می‌خواند.
function getUserToken(){
  try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
}
function clearUserToken(){
  try { localStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
}
// نشست معتبر نیست ← از داشبورد بخواه صفحه‌ی ورود را نشان دهد
function authExpired(){
  clearUserToken();
  if (window.top !== window.self) window.parent.postMessage({ type: 'auth-expired' }, location.origin);
  else location.href = '../../index.html';
}

async function onAuthenticated(){
  const token = getUserToken();
  if (!token){ authExpired(); return; }
  let me = null;
  try {
    const resp = await fetch(AUTH_BASE + '/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
    if (resp.ok) me = await resp.json();
    else if (resp.status === 401) { authExpired(); return; }
  } catch (err) { }
  if (!me) return;                    // خطای شبکه: کاربر را بیرون نینداز
  pageEl.classList.remove('hidden');
  userEmailLabel.textContent = me.username || '';
  userRolePill.textContent = me.role === 'admin' ? 'مدیر' : 'کاربر';
}
onAuthenticated();

function showStatus(el, kind, text){
  el.className = 'status show ' + kind;
  el.textContent = text;
}
function hideStatus(el){
  el.className = 'status';
  el.textContent = '';
}

function b64ToBlobUrl(base64, contentType){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: contentType });
  return URL.createObjectURL(blob);
}

function renderFiles(container, files){
  container.innerHTML = '';
  files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';

    const row = document.createElement('div');
    row.className = 'file-row';

    const meta = document.createElement('div');
    meta.className = 'file-meta';
    const icon = document.createElement('div');
    icon.className = 'file-icon';
    icon.textContent = f.ext ? f.ext.toUpperCase().slice(0,3) : 'FILE';
    const name = document.createElement('div');
    name.className = 'file-name';
    name.textContent = f.filename;
    meta.appendChild(icon);
    meta.appendChild(name);

    const actions = document.createElement('div');
    actions.className = 'file-actions';

    const preview = document.createElement('div');
    preview.className = 'file-preview';

    const viewBtn = document.createElement('button');
    viewBtn.className = 'btn-sm view';
    viewBtn.textContent = 'نمایش';
    viewBtn.onclick = () => togglePreview(f, preview, viewBtn);

    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-sm';
    dlBtn.textContent = 'دانلود';
    dlBtn.onclick = () => downloadFile(f);

    actions.appendChild(viewBtn);
    actions.appendChild(dlBtn);

    row.appendChild(meta);
    row.appendChild(actions);
    item.appendChild(row);
    item.appendChild(preview);
    container.appendChild(item);
  });
}

function togglePreview(f, previewEl, btn){
  const isOpen = previewEl.classList.contains('open');
  if (isOpen){
    previewEl.classList.remove('open');
    previewEl.innerHTML = '';
    btn.textContent = 'نمایش';
    return;
  }
  if (!previewEl.dataset.url){
    previewEl.dataset.url = b64ToBlobUrl(f.contentBase64, f.contentType);
  }
  const iframe = document.createElement('iframe');
  iframe.src = previewEl.dataset.url;
  previewEl.innerHTML = '';
  previewEl.appendChild(iframe);
  previewEl.classList.add('open');
  btn.textContent = 'بستن پیش‌نمایش';
}

function downloadFile(f){
  const url = b64ToBlobUrl(f.contentBase64, f.contentType);
  const a = document.createElement('a');
  a.href = url;
  a.download = f.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
const policyInput = document.getElementById('policyInput');
const searchBtn = document.getElementById('searchBtn');
const statusEl = document.getElementById('status');
const fileListEl = document.getElementById('fileList');

async function doSearch(){
  hideStatus(statusEl);
  fileListEl.innerHTML = '';
  const policyNumber = policyInput.value.trim();
  if (!policyNumber){
    showStatus(statusEl, 'error', 'شماره بیمه رو وارد کنید.');
    return;
  }

  searchBtn.disabled = true;
  const originalText = searchBtn.textContent;
  searchBtn.innerHTML = '<span class="spinner"></span>در حال دریافت...';

  try{
    const resp = await fetch(API_BASE + '/api/endorsement/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (await getUserToken()) },
      body: JSON.stringify({ policyNumber }),
    });

    if (resp.status === 401){ showStatus(statusEl, 'error', 'نشست شما معتبر نیست؛ لطفاً دوباره وارد شوید.'); authExpired(); return; }
    if (resp.status === 403){ showStatus(statusEl, 'error', 'دسترسی لازم برای این عملیات را ندارید.'); return; }
    if (resp.status === 429){ showStatus(statusEl, 'error', 'تعداد درخواست‌ها زیاده؛ کمی صبر کنید و دوباره تلاش کنید.'); return; }
    if (resp.status === 400){ showStatus(statusEl, 'error', 'فرمت شماره بیمه صحیح نیست.'); return; }
    if (resp.status === 502){ showStatus(statusEl, 'error', 'سامانه sales.iic.local در حال حاضر در دسترس نیست.'); return; }
    if (!resp.ok){ showStatus(statusEl, 'error', 'خطایی رخ داد؛ دوباره تلاش کنید.'); return; }

    const data = await resp.json();
    if (!data.files || data.files.length === 0){
      showStatus(statusEl, 'empty', 'برای این بیمه‌نامه الحاقیه‌ای پیدا نشد.');
      return;
    }

    showStatus(statusEl, 'info', data.files.length + ' الحاقیه پیدا شد.');
    renderFiles(fileListEl, data.files);

  } catch(err){
    showStatus(statusEl, 'error', 'ارتباط با سرور برقرار نشد.');
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = originalText;
  }
}

searchBtn.addEventListener('click', doSearch);
policyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
</script>

</body>
</html>
